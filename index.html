<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="輕輕日記">
<meta name="theme-color" content="#fff3ec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>輕輕日記</title>
<style>
:root{
  --bg:#fff7f2; --card:#ffffff; --ink:#4a3b36; --soft:#9a8580; --line:#f1e4dd;
  --peach:#ffb59a; --peach-d:#f28c6a; --mint:#9fe0c8; --mint-d:#4fbf98;
  --sky:#a9d8ff; --sky-d:#4fa3e8; --sun:#ffd86b; --pink:#ffc8d8;
  --r:22px; --shadow:0 6px 20px rgba(160,100,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));padding-top:calc(16px + env(safe-area-inset-top))}
@media(min-width:760px){
  body{background:linear-gradient(135deg,#ffeee5,#eef9f4)}
  .app{background:var(--bg);min-height:100vh;box-shadow:0 0 40px rgba(160,100,80,.12)}
}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}
.hello{font-size:22px;font-weight:800}
.date{font-size:13px;color:var(--soft);margin-top:2px}
.streak{background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;box-shadow:var(--shadow);font-size:15px;white-space:nowrap}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:500;color:var(--soft);font-size:12px}
.muted{color:var(--soft);font-size:13px}

/* pet */
.petcard{background:linear-gradient(180deg,#fff0e8 0%,#ffffff 85%);text-align:center;position:relative;overflow:hidden}
.petcard.rainbow{background:linear-gradient(180deg,#ffe3ec 0%,#fff4d6 30%,#e3f7ee 60%,#ffffff 90%)}
.stage{position:relative;width:180px;height:170px;margin:6px auto 0}
.pet{width:180px;height:170px;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.pet.jump{animation:jump .6s ease}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(1.02,.98)}}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-28px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.acc{position:absolute;font-size:34px;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08))}
.acc.head{left:50%;top:6px;font-size:44px;transform:translateX(-50%) rotate(-8deg)}
.acc.face{left:50%;top:66px;transform:translateX(-50%);font-size:40px}
.acc.neck{left:50%;top:112px;transform:translateX(-50%);font-size:30px}
.acc.hand{right:2px;top:70px;font-size:32px;animation:sway 3s ease-in-out infinite}
.acc.side{left:4px;top:30px;font-size:26px;animation:flutter 2.2s ease-in-out infinite}
.acc.aura{left:8px;top:110px;font-size:22px;animation:twinkle 1.8s ease-in-out infinite}
.acc.aura2{right:14px;top:6px;font-size:20px;animation:twinkle 2.3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes flutter{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-8px)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.bubble{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 14px;font-size:14px;margin:2px 10px 8px;max-width:90%;position:relative}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.away{font-size:15px;padding:30px 0 12px}
.ringrow{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:8px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--peach)}

/* weight input */
.wrow{display:flex;align-items:center;gap:10px;justify-content:center}
.step{width:48px;height:48px;border-radius:50%;background:#fff3ec;font-size:24px;font-weight:800;color:var(--peach-d)}
.step:active{transform:scale(.92)}
.wnum{width:120px;text-align:center;font-size:34px;font-weight:800;border:0;border-bottom:3px solid var(--line);background:transparent;padding:4px 0;outline:none}
.wunit{font-size:15px;color:var(--soft)}
.btn{display:block;width:100%;padding:13px;border-radius:16px;background:var(--peach-d);color:#fff;font-weight:800;font-size:16px;margin-top:12px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff3ec;color:var(--peach-d)}
.btn.mint{background:var(--mint-d)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin-top:0}
.done-line{display:flex;justify-content:space-between;align-items:center;background:#effaf5;border-radius:14px;padding:12px 14px}
.done-line b{font-size:22px}

/* water */
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cup{aspect-ratio:3/4;border-radius:8px 8px 12px 12px;border:2px solid #cfe8ff;background:#fff;position:relative;overflow:hidden}
.cup:after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#bfe3ff,#7cc2f5);transition:height .35s}
.cup.on:after{height:78%}
.cup:active{transform:scale(.9)}

/* habits */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.habit{display:flex;align-items:center;gap:8px;padding:12px;border-radius:16px;background:#faf5f2;text-align:left;font-size:14px;line-height:1.3;border:2px solid transparent;transition:.2s}
.habit .e{font-size:24px}
.habit.on{background:#effaf5;border-color:var(--mint)}
.habit.on .t:after{content:" ✓";color:var(--mint-d);font-weight:800}
.habit:active{transform:scale(.96)}

/* mood */
.moods{display:flex;justify-content:space-between}
.mood{font-size:30px;width:52px;height:52px;border-radius:50%;opacity:.45;transition:.2s}
.mood.on{opacity:1;background:#fff3ec;transform:scale(1.1)}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;resize:none;background:#fffdfb;outline:none}

/* 語音日記 */
.voice-card{background:#fffaf6;border:1px solid #f2ded1}
.voice-card p{margin:6px 0;font-size:14px;line-height:1.5;color:#735b50}
.voice-card textarea{margin-top:4px;background:#fff}
.voice-card button:focus-visible,.voice-card textarea:focus,.voice-card input:focus,.voice-card select:focus,.voice-card summary:focus-visible{outline:2px solid #9c4e37;outline-offset:2px}
.voice-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.voice-actions .btn{flex:1;width:auto;margin:0;min-height:44px}
.voice-card .btn{background:#a75038;color:#fff}
.voice-card .btn.ghost{background:#f9e7dc;color:#843e2b}
.voice-card button:disabled{opacity:.55;cursor:default}
.voice-card .voice-help{font-size:13px;margin-top:10px}
.voice-review{margin-top:12px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);scroll-margin-top:12px}
.voice-review h4{margin:0 0 10px;font-size:15px}
.voice-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.voice-fields .f{margin:0}
.voice-fields .voice-wide{grid-column:1/-1}
.voice-fields input,.voice-fields select{min-width:0;font-size:16px;min-height:44px;margin-top:4px}
.voice-review .voice-note{margin:10px 0 0}
.voice-review ul{margin:0 0 10px;padding-left:20px;font-size:13px;line-height:1.5;color:#843e2b}
.voice-history{margin-top:12px;border-top:1px solid var(--line)}
.voice-history summary{padding:12px 0 4px;cursor:pointer;font-weight:700;font-size:14px}
.voice-history li{display:block}
.voice-entry{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:5px}
.voice-entry button{min-height:44px;min-width:44px;color:#843e2b;font-weight:700;text-decoration:underline}
.voice-note-text{white-space:pre-wrap;overflow-wrap:anywhere}
.voice-card [hidden]{display:none}

/* weight tab */
.big{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:6px}
.big b{display:block;font-size:24px}
.big span{font-size:12px;color:var(--soft)}
.road{position:relative;height:16px;background:var(--line);border-radius:999px;margin:20px 6px 26px}
.road .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--peach),var(--peach-d));border-radius:999px;transition:width .6s}
.road .ms{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center}
.road .ms.on{border-color:var(--peach-d)}
.road .me{position:absolute;top:-30px;font-size:22px;transform:translateX(-50%);transition:left .6s}
.seg{display:flex;background:#faf5f2;border-radius:12px;padding:3px}
.seg button{padding:5px 10px;border-radius:10px;font-size:12px;color:var(--soft)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.06)}
svg.chart{width:100%;height:auto;display:block}
.tip{background:#fff8e1;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:10px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border:0}
.del{color:#c9b3ab;font-size:13px;padding:4px 8px}

/* collection */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.item{aspect-ratio:1;border-radius:16px;background:#faf5f2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px}
.item small{font-size:10px;color:var(--soft);margin-top:2px}
.item.lock{filter:grayscale(1);opacity:.4}
.post{background:#fffaf0;border:2px dashed #f3d9b1;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.6}
.post .d{font-size:11px;color:var(--soft)}

/* forms */
label.f{display:block;margin-bottom:12px;font-size:14px;font-weight:700}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fffdfb;font-weight:500;outline:none}
label.f input:focus,label.f textarea:focus{border-color:var(--peach)}
.warn{background:#fff0f0;color:#b5543c;border-radius:12px;padding:10px 12px;font-size:13px;margin:-4px 0 12px;line-height:1.5}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs .in{max-width:480px;margin:0 auto;display:flex}
.tabs button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:22px;filter:grayscale(1);opacity:.6}
.tabs button.on{color:var(--peach-d);font-weight:800}
.tabs button.on span{filter:none;opacity:1}

/* modal & toast */
.mask{position:fixed;inset:0;background:rgba(74,59,54,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;animation:fade .2s}
.modal{background:#fff;border-radius:26px;padding:24px 20px 18px;max-width:360px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.modal .em{font-size:64px;line-height:1.1}
.modal h2{margin:8px 0 6px;font-size:20px}
.modal p{margin:0 0 6px;line-height:1.7;font-size:15px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;animation:fade .2s;white-space:nowrap}
.confetti{position:fixed;top:-40px;font-size:24px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* nudge */
.nudge{background:linear-gradient(90deg,#fff4d6,#ffe9e0);border-radius:16px;padding:11px 14px;margin-bottom:14px;font-size:14px;line-height:1.5;box-shadow:var(--shadow)}
/* meals */
.meal{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-of-type{border-bottom:0}
.meal .me{font-size:24px;width:30px;text-align:center}
.meal .mt{flex:1;font-size:14px;line-height:1.45}
.meal .mt b{display:block;font-size:12px;color:var(--soft);font-weight:700}
.meal .mt small{color:var(--soft)}
.meal.eaten .mt{opacity:.55}
.mini{min-width:38px;height:34px;border-radius:12px;background:#faf5f2;font-size:13px;font-weight:700;color:var(--soft);padding:0 8px}
.mini.on{background:var(--mint-d);color:#fff}
/* workout */
.wk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#faf5f2;margin-bottom:8px}
.wk.on{background:#effaf5}
.wk .e{font-size:26px}
.wk .tx{flex:1;font-size:14px;line-height:1.45}
.wk .tx small{color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips span{background:#fff;border-radius:999px;padding:3px 9px;font-size:12px}
.timer .em{font-size:80px}
.count{font-size:64px;font-weight:900;color:var(--peach-d);line-height:1;margin:6px 0}
.count.rest{color:var(--mint-d)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--peach);transition:width .9s linear}
.row2{display:flex;gap:8px}.row2 .btn{margin-top:8px}
/* reminders */
.rm{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rm:last-of-type{border-bottom:0}
.rm span{flex:1}
.rm input[type=time]{border:2px solid var(--line);border-radius:10px;padding:5px 6px;background:#fffdfb}
.rm input[type=checkbox]{width:20px;height:20px;accent-color:var(--peach-d)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:16px;background:#fff;border:2px solid #e3dcd8;font-weight:700;font-size:15px}
.gbtn:active{transform:scale(.98)}
.gbtn[disabled]{opacity:.5}
.acct{display:flex;align-items:center;gap:12px}
.acct img,.acct span{width:44px;height:44px;border-radius:50%;background:#faf5f2;display:flex;align-items:center;justify-content:center;font-size:22px}
.logintip{background:linear-gradient(135deg,#eaf4ff,#fff3ec);border:2px solid #d6e8fb;border-radius:var(--r);padding:16px;margin-bottom:14px;text-align:center;box-shadow:var(--shadow)}
.logintip .lt-t{font-weight:800;font-size:16px}
.logintip .later{margin-top:8px;font-size:13px;color:var(--soft);padding:6px 10px}
.vids{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.wrowx{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed #f1dfe4;font-size:13px;flex-wrap:wrap}.wrowx b{width:42px}
.wstat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.wstat small{display:block;color:#a58b93;font-size:11px}.wstat b{font-size:18px}
.pbar{height:10px;border-radius:9px;background:#f6e6ea;overflow:hidden;margin-top:10px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9fb5,#ffc58f)}
.vids .vh{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.vid{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:16px;background:#faf5f2;margin-bottom:8px}
.vid.on{background:#effaf5}
.vthumb{position:relative;width:132px;flex:none;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#eee}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.vthumb em{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-size:11px;padding:1px 5px;border-radius:6px}
.vtx{flex:1;min-width:0;font-size:13px;line-height:1.4;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.vtx b{font-size:13px}
.vtx small{color:var(--soft);font-size:11px}
.vtx .mini{margin-top:4px;height:28px;font-size:12px}
.vmodal{max-width:560px;padding:12px 12px 14px}
.vframe{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* 三頁切換 */
.seg{display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px;margin:0 0 14px;box-shadow:var(--shadow);position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:20}
.seg button{flex:1;padding:9px 0;border-radius:999px;font-weight:800;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--peach-d);color:#fff}
/* 提醒 */
.pform .r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pform label.f{margin-bottom:8px}
.pgrp{font-weight:800;font-size:14px;margin:4px 2px 8px;color:var(--ink)}
.pit{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.pit:last-child{border-bottom:0}
.pit .tm{font-weight:800;font-size:15px;width:48px;color:var(--peach-d)}
.pit .tt{flex:1;font-size:15px;line-height:1.35;min-width:0;word-break:break-all}
.pit .tt small{display:block;color:var(--soft);font-size:11px}
.pit.done .tt{text-decoration:line-through;opacity:.5}
.tag{display:inline-block;font-size:10px;border-radius:6px;padding:1px 5px;margin-left:4px;background:#eef6ff;color:var(--sky-d);text-decoration:none}
.tag.late{background:#fff0f0;color:#c0573e}
.todaybar{display:flex;align-items:center;gap:10px;background:#eef6ff;border-radius:16px;padding:11px 14px;margin-bottom:14px;font-size:14px;box-shadow:var(--shadow)}
.todaybar b{color:var(--sky-d)}
/* 記帳 */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.mnav b{font-size:18px}
.msum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.msum small{display:block;color:var(--soft);font-size:12px}
.msum b{font-size:19px}
.in-c{color:var(--mint-d)} .out-c{color:#e0715a}
.ttog{display:flex;gap:6px;margin-bottom:10px}
.ttog button{flex:1;padding:10px;border-radius:14px;background:#faf5f2;font-weight:800;color:var(--soft)}
.ttog button.on.out{background:#ffe6df;color:#d4583d}
.ttog button.on.in{background:#dff6ec;color:#2f9e78}
.amt{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:16px;padding:6px 12px;background:#fffdfb;margin-bottom:10px}
.amt span{font-weight:800;color:var(--soft)}
.amt input{flex:1;border:0;outline:0;background:none;font-size:28px;font-weight:800;width:100%;min-width:0}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cats button{padding:7px 11px;border-radius:999px;background:#faf5f2;font-size:14px}
.cats button.on{background:var(--peach-d);color:#fff;font-weight:800}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mrow2 input{width:100%;padding:11px;border-radius:14px;border:2px solid var(--line);background:#fffdfb;outline:none;min-width:0}
.cbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.cbar .cn{width:62px;flex:none}

  const updatedAt = Math.max(Date.now(), (S.updatedAt||0)+1, ...changed.map(date=>(S.days[date].u||0)+1));

// 兩邊的資料合併：以比較新的為主，另一邊多出來的日子、明信片也保留
function mergeData(a, b){
  if(!a || !a.profile) return b; if(!b || !b.profile) return a;
  const [n, o] = (a.updatedAt||0) >= (b.updatedAt||0) ? [a, b] : [b, a];
  const m = JSON.parse(JSON.stringify(n));
  m.days = m.days || {};
  for(const [date, day] of Object.entries(o.days||{})){
    if(!m.days[date] || (day.u||0) > (m.days[date].u||0)) m.days[date] = day;
  }
  m.postcards = m.postcards || [];
  const seen = new Set(m.postcards.map(c=>c.d+c.t));
  (o.postcards||[]).forEach(c=>{ if(!seen.has(c.d+c.t)) m.postcards.push(c); });
  m.postcards.sort((x,y)=> x.d < y.d ? -1 : x.d > y.d ? 1 : 0);
  m.events = mergeList(a.events, b.events);
  m.ledger = mergeList(a.ledger, b.ledger);
  m.unlocked = Math.max(n.unlocked||0, o.unlocked||0);
  m.updatedAt = Math.max(n.updatedAt||0, o.updatedAt||0);
  return m;
}

function parseSpokenDiary(text, defaultDate, todayDate = defaultDate) {
  const source = text.trim();
  const normalized = source.replace(/[！-～]/g, char => String.fromCharCode(char.charCodeAt(0) - 0xFEE0));
  const empty = { date: null, weight: null, waist: null, water: null, note: source, warnings: [] };
  const dateMentions = [];

  const dateDigits = '[0-9零〇○一二兩两三四五六七八九十]';
  const datePattern = new RegExp(`(?:\\d{4}[-/.]\\d{1,2}[-/.]\\d{1,2}|(?:${dateDigits}{4}年\\s*)?${dateDigits}{1,4}月\\s*${dateDigits}{1,4}[日號]?|\\d{1,2}\\/\\d{1,2})(?!\\d)|前天|前日|前晚|昨天|昨日|昨晚|昨夜|昨早|今天|今日|今早|今晚|明天|明日|明早|明晚|後天`, 'g');
  const unspecifiedDate = /(?:上|下|這|本)?(?:禮拜|星期|週|周)[日天一二三四五六1-7]|前幾天|那天|前一[天晚]|隔天/g;
  for (const match of normalized.matchAll(unspecifiedDate)) {
    const after = normalized.slice(match.index + match[0].length);
    if (/^\s*(?:(?:的|早上|晚上|我)\s*)*(?:體重|腰圍|喝水|喝了|量了|量到|\d)/.test(after)) {
      return { ...empty, warnings: ['請在輸入內容寫明這筆記錄的日期。'] };
    }
  }
  for (const match of normalized.matchAll(datePattern)) {
    const before = normalized.slice(0, match.index);
    const after = normalized.slice(match.index + match[0].length);
    if (/^[0-9]/.test(match[0]) && (/[\d./-]$/.test(before) || /^(?:\/\d|[-.]\d)/.test(after))) continue;
    if (/(?:比|較|跟|和|與|從|到|自|距|離)\s*$/.test(before) || /^\s*(?:相比|比起|一樣)/.test(after)) continue;
    if (/^7\/11$/.test(match[0]) && /(?:去|在|進|逛)\s*$/.test(before)) continue;
    if (/^(?:昨晚|昨夜)$/.test(match[0]) && /^\s*(?:我\s*)?(?:睡|有睡|沒睡|失眠|熬夜|醒|做夢)/.test(after)) continue;
    const date = spokenDiaryDate(match[0], todayDate);
    dateMentions.push({ date, start: match.index, end: match.index + match[0].length });
  }

  const dates = [...new Set(dateMentions.map(mention => mention.date))];
  const date = dates.length ? dates[0] : defaultDate;
  if (dates.length > 1) return { ...empty, warnings: ['內容有不同日期，請分開記錄。'] };
  if (!validSpokenDiaryDate(date) || date > todayDate) {
    return { ...empty, warnings: ['請確認記錄日期，並選擇今天或之前的日期。'] };
  }

  const withDatesMasked = maskSpokenDiarySpans(normalized, dateMentions);
  const clauses = [...withDatesMasked.matchAll(/(?:\d[,，.]\d|[^、，,。！？!?；;\n.])+/g)];
  const number = '[0-9零〇○一二兩两三四五六七八九十百]{1,8}(?:[.點点][0-9零〇○一二兩两三四五六七八九]{1,6})?';
  const weightUnit = '公斤|千克|仟克|kg';
  const waistUnit = '公分|厘米|公釐|毫米|cm|mm';
  const pause = '\\s*(?:[:=]\\s*)?';
  const link = '(?:(?:目前|現在|剛剛|剛才|剛|是|為|大約|大概|約|量到|量起來|量了|量出來|量|測得|測到|有|到)\\s*)*';
  const specs = [
    {
      key: 'weight', label: '體重', min: 25, max: 300,
      patterns: [
        new RegExp(`體重${pause}${link}(${number})\\s*(${weightUnit})?`, 'gi'),
        new RegExp(`(?:秤重|秤起來|秤了|秤到|量到|量了|量起來|我重)${pause}${link}(${number})\\s*(${weightUnit})`, 'gi'),
        new RegExp(`^\\s*(?:我\\s*)?(?:(?:早上|早晨|一早|起床後|睡前|剛剛|剛才|剛)\\s*)?(${number})\\s*(${weightUnit})\\s*$`, 'i')
      ]
    },
    {
      key: 'waist', label: '腰圍', min: 20, max: 250,
      patterns: [
        new RegExp(`(?:腰圍|腰部(?:圍度|周長|週長)|腰的圍度)${pause}${link}(${number})\\s*(${waistUnit})?`, 'gi')
      ]
    },
    {
      key: 'water', label: '喝水', min: 0, max: 30,
      patterns: [
        new RegExp(`(?:喝水|飲水|白開水|開水|水量)${pause}(?:(?:喝了|喝|總共|一共|共|到|了)\\s*)*(${number})\\s*(杯)(?:水)?`, 'gi'),
        new RegExp(`(?:^|\\s)水${pause}(${number})\\s*(杯)`, 'gi'),
        new RegExp(`(?:已喝|喝了|喝)${pause}(?:(?:總共|一共|共)\\s*)*(${number})\\s*(杯)\\s*(?:白開水|開水|水)`, 'gi')
      ]
    }
  ];
  const draft = { ...empty, date, note: '' };
  const remove = [];

  for (const spec of specs) {
    const candidates = [];
    let unclear = false;
    for (const { 0: clause, index } of clauses) {
      const matches = spec.patterns.flatMap(pattern => pattern.global ? [...clause.matchAll(pattern)] : [clause.match(pattern)].filter(Boolean));
      for (const match of matches) {
        const start = index + match.index;
        const end = start + match[0].length;
        if (candidates.some(candidate => candidate.start === start && candidate.end === end)) continue;
        const before = clause.slice(0, match.index);
        const after = clause.slice(match.index + match[0].length);
        if (spec.key === 'weight' && /(?:腰圍|腰部|行李|手提包|嬰兒|米|狗|貓|小孩)\s*$/.test(before)) continue;

        const value = spokenDiaryNumber(match[1]);
        // Ranges, estimates, and intentions belong in the user's note.
        const uncertainBefore = /(?:目標|希望|想要?|打算|預計|計畫|如果|還差|只差|差|沒有|沒|未|不要|別|並非|不是|不確定|可能|大約|大概|約|多|少)\s*(?:(?:要|再|量|量到|量了|的|記錄|記|是|為|達到)\s*)*$/.test(before);
        const uncertainInside = /(?:大約|大概|約)/.test(match[0]);
        const uncertainAfter = /^\s*(?:[~—-]|(?:到|至|或|跟)\s*[0-9零一二兩三四五六七八九十百]|[.,]\s*\d|[多少](?=\s*$|\s*(?:杯|公斤|公分|了|一[點公斤公分]|\d))|左右|上下|出頭|不到|以上|以下|幾|半|嗎|嘛)/.test(after);
        const question = normalized[index + clause.length] === '?';
        const invalidUnit = match[2] == null && /^\s*(?:斤|磅|公斤|千克|仟克|公克|克|公分|厘米|公釐|毫米|英[吋寸]|吋|寸|公尺|米|毫升|公升|升|%|杯|(?:lbs?|kg|g|oz|cm|mm|m|cc|ml|l)\b)/i.test(after);
        const otherBeverage = spec.key === 'water' && /^\s*(?:茶|咖啡|奶|汽水|果汁|酒|飲料)/.test(after);
        const badRange = value === null || value < spec.min || value > spec.max || (spec.key === 'weight' && (value === spec.min || value === spec.max));
        const unsupportedWaistUnit = spec.key === 'waist' && /^(?:毫米|公釐|mm)$/i.test(match[2] || '');
        if (uncertainBefore || uncertainInside || uncertainAfter || question || invalidUnit || otherBeverage || badRange || unsupportedWaistUnit || (spec.key === 'water' && !Number.isInteger(value))) {
          unclear = true;
          continue;
        }
        candidates.push({ start, end, value: Math.round(value * 10) / 10 });
      }

      const fullMetricLabel = spec.key === 'weight' ? /體重/ : spec.key === 'waist' ? /腰圍|腰部(?:圍度|周長|週長)/ : /喝水|飲水|白開水/;
      if (!matches.length && fullMetricLabel.test(clause) && /(?:多|少|增加|減少|減了|變重|變輕|變細|變粗|[0-9一二兩三四五六七八九十百]+\s*(?:斤|磅|吋|公斤|公分|杯|毫升|CC|ML))/i.test(clause)) {
        unclear = true;
      }
    }

    const values = [...new Set(candidates.map(candidate => candidate.value))];
    if (values.length > 1) {
      draft.warnings.push(`${spec.label}出現不同數字，請確認要記哪一個。`);
    } else if (unclear) {
      draft.warnings.push(`${spec.label}的說法需要確認，先放在備註。`);
    } else if (values.length) {
      draft[spec.key] = values[0];
      remove.push(...candidates);
    }
  }

  if (!remove.length) {
    draft.note = maskSpokenDiarySpans(source, dateMentions).trim() ? source : '';
    return draft;
  }

  const rest = maskSpokenDiarySpans(source, [...remove, ...dateMentions]);
  let previousEnd = null;
  for (const { 0: clause, index } of clauses) {
    const remainder = rest.slice(index, index + clause.length)
      .replace(/\s{2,}/g, ' ').trim()
      .replace(/^(?:我(?:的)?\s*)?(?:(?:剛剛|剛才|剛|早上|晚上|起床後|睡前)\s*)?(?:(?:量了|量到|測了|記一下|順便記一下|記錄|日期是)\s*)?(?:的\s*)?$/, '')
      .replace(/^(?:還有|另外|以及|再加上)\s*(?=\S)/, '')
      .replace(/\s*(?:還有|另外|以及|跟|和)\s*$/, '');
    if (!remainder) continue;
    if (previousEnd !== null) {
      const separator = source.slice(previousEnd, index);
      draft.note += /^[、，,。！？!?；;\n.]+$/.test(separator) ? separator : '，';
    }
    draft.note += remainder;
    previousEnd = index + clause.length;
  }
  const ending = previousEnd === null ? '' : source.slice(previousEnd);
  if (/^[。！？!?.…]+$/.test(ending)) draft.note += ending;
  return draft;
}

function validSpokenDiaryDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return false;
  const date = new Date(value + 'T00:00:00Z');
  return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value;
}

function spokenDiaryDate(value, todayDate) {
  if (/^(?:明|後天)/.test(value)) return null;
  if (/^(?:今|昨|前)/.test(value)) {
    if (!validSpokenDiaryDate(todayDate)) return null;
    const delta = value.startsWith('前') ? -2 : value.startsWith('昨') ? -1 : 0;
    const date = new Date(todayDate + 'T00:00:00Z');
    date.setUTCDate(date.getUTCDate() + delta);
    return date.toISOString().slice(0, 10);
  }
  const parts = (value.match(/[0-9零〇○一二兩两三四五六七八九十]+/g) || []).map(spokenDiaryNumber);
  if (parts.some(part => part === null)) return null;
  if (parts.length === 2) parts.unshift(todayDate.slice(0, 4));
  return parts.map((part, index) => index ? String(part).padStart(2, '0') : part).join('-');
}

function maskSpokenDiarySpans(text, spans) {
  const chars = text.split('');
  for (const { start, end } of spans) chars.fill(' ', start, end);
  return chars.join('');
}

function spokenDiaryNumber(text) {
  const digits = '零一二三四五六七八九';
  const [integer, fraction] = text.replace(/[〇○]/g, '零').replace(/[兩两]/g, '二')
    .replace(/[零一二三四五六七八九]/g, char => digits.indexOf(char))
    .split(/[.點点]/);
  let whole;
  if (/^\d+$/.test(integer)) {
    whole = Number(integer);
  } else {
    const match = integer.match(/^(?:(\d)百)?(?:(\d?)十)?(?:(0?\d))?$/);
    if (!match) return null;
    const [, hundreds, tens, single] = match;
    whole = (hundreds ? Number(hundreds) * 100 : 0)
      + (tens === undefined ? 0 : Number(tens || '1') * 10)
      + Number(single || '0');
    // In speech, "一百五" can mean 150. Require an explicit tens value.
    if (hundreds && tens === undefined && single && single.length === 1 && single !== '0') return null;
  }
  return fraction ? Number(`${whole}.${fraction}`) : whole;
}

/* 提醒語句整理 */
function parseSpokenReminder(text, todayDate) {
  const raw = text.trim();
  const noteAt = raw.match(/[，,；;。\n]\s*備註\s*(?:是|為|[：:])?\s*/);
  const body = noteAt ? raw.slice(0, noteAt.index) : raw;
  const extra = noteAt ? raw.slice(noteAt.index + noteAt[0].length).trim() : '';
  const normalized = body.replace(/[！-～]/g, char => String.fromCharCode(char.charCodeAt(0) - 0xFEE0));
  const warnings = [];
  const spans = [];
  const number = '[0-9零〇○一二兩两三四五六七八九十百]{1,4}';
  const weekdays = '日天一二三四五六1-7';
  const dayIndex = char => /[1-7]/.test(char) ? Number(char) % 7 : '日一二三四五六'.indexOf(char === '天' ? '日' : char);
  const span = match => ({ start: match.index, end: match.index + match[0].length });

  // The existing reminder can repeat on one weekday or one day of the month.
  const unsupported = new RegExp(`(?:每週|每周|每個?星期|每個?禮拜|逢週|逢周)\\s*[${weekdays}]\\s*(?:[、,與和及到至-]\\s*(?:(?:每)?(?:週|周|星期|禮拜)\\s*)?[${weekdays}])+|(?:週|周|星期|禮拜)[${weekdays}]\\s*(?:到|至|-)\\s*(?:(?:週|周|星期|禮拜)\\s*)?[${weekdays}]|每個?工作日|工作日|每個?平日|平日|每個?[週周]末|星期六日|每隔${number}天|每${number}天|隔週|隔周|每兩週|每兩周`, 'g');
  const unsupportedMatches = [...normalized.matchAll(unsupported)];
  spans.push(...unsupportedMatches.map(span));
  const recurrenceText = maskSpokenDiarySpans(normalized, spans);
  const recurPatterns = [
    { rep: 'daily', pattern: /每天|每日|天天/g },
    { rep: 'weekly', pattern: new RegExp(`(?:每週|每周|每個?星期|每個?禮拜|逢週|逢周|每逢星期|每逢禮拜)(?:\\s*([${weekdays}])(?!次|天|個)|\\s*一次)?`, 'g') },
    { rep: 'monthly', pattern: new RegExp(`(?:每個?月)(?:\\s*(${number})\\s*[日號]|\\s*一次)?`, 'g') }
  ];
  const recurrences = recurPatterns.flatMap(({ rep, pattern }) =>
    [...recurrenceText.matchAll(pattern)].map(match => ({ rep, day: match[1] || '', ...span(match) })));
  spans.push(...recurrences);
  const recurrenceKeys = [...new Set(recurrences.map(item => item.rep + ':' + item.day))];
  const recurrence = recurrences[0];
  let rep = recurrence?.rep || 'none';
  if (unsupportedMatches.length || recurrenceKeys.length > 1) {
    rep = '';
    warnings.push('重複頻率需要確認。目前每筆提醒可以選每天、每週同一天或每月同一天。');
  }

  const dateText = maskSpokenDiarySpans(normalized, spans);
  const invalidDateWords = /下個月|下個禮拜|下個星期|下週|下周|下星期|下禮拜|週末|周末|過幾天|幾天後|下次/g;
  const datePattern = new RegExp(`(?:(?:\\d{4}[-/.]\\d{1,2}[-/.]\\d{1,2}|\\d{1,2}\\/\\d{1,2})(?![0-9])|(?:${number}年\\s*)?${number}月\\s*${number}\\s*(?:[日號]|(?![日號0-9])))|(?:${number})\\s*天後|(?:(?:下一個|下個|下|這個|這|本|上個|上)\\s*)?(?:星期|禮拜|週|周)\\s*[${weekdays}]|後天|大後天|明天|明日|明早|明晚|隔天|今天|今日|今早|今晚|昨天|昨日|前天`, 'g');
  const dateMatches = [...dateText.matchAll(datePattern)];
  const unresolved = [...maskSpokenDiarySpans(dateText, dateMatches.map(span)).matchAll(invalidDateWords)]
    .filter(match => !dateMatches.length || /(?:或|和|跟|以及|到|至)\s*$/.test(dateText.slice(0, match.index)));
  const dates = dateMatches.map(match => parseSpokenReminderDate(match[0], todayDate, dayIndex));
  spans.push(...dateMatches.map(span), ...unresolved.map(span));
  const distinctDates = [...new Set(dates)];
  const dateConflict = distinctDates.length > 1;
  const badDate = unresolved.length > 0 || dates.some(value => !value) || !validSpokenDiaryDate(todayDate);
  let date = badDate || dateConflict ? '' : distinctDates[0] || todayDate;
  if (date && rep === 'weekly' && recurrence?.day) {
    date = nextSpokenReminderWeekday(date, dayIndex(recurrence.day));
  }
  if (date && rep === 'monthly' && recurrence?.day) {
    const day = spokenDiaryNumber(recurrence.day);
    date = nextSpokenReminderMonthDay(date, day);
  }
  if (date && recurrence && !recurrence.day && (rep === 'weekly' || rep === 'monthly') && !dates.length) {
    date = '';
    warnings.push(rep === 'weekly' ? '請補上每週哪一天。' : '請補上每月幾號。');
  } else if (!date || date < todayDate) {
    date = '';
    warnings.push(dateConflict ? '內容有不同日期，請確認提醒開始的日子。' : '請確認提醒日期，並選擇今天或之後的日子。');
  }

  // Leave compound phrases (明早、今晚) visible to the time matcher for AM/PM.
  const timeText = maskSpokenDiarySpans(normalized, spans.filter(({ start, end }) =>
    !/^(?:今早|明早|今晚|明晚)$/.test(normalized.slice(start, end))));
  const periods = '凌晨|清晨|早上|早晨|上午|今早|明早|中午|午後|下午|傍晚|黃昏|晚上|夜間|今晚|明晚|早|晚|[ap]\\.?m\\.?';
  const timePattern = new RegExp(`(?:(${periods})\\s*)?(${number})\\s*(?::\\s*(${number})|[點点時时](?:鐘)?\\s*(?:(半)|([一二三123])刻|(${number})\\s*分|([0-9]{2}|[一二三四五]?十[一二三四五六七八九]?)\\s*)?)(?:\\s*([ap]\\.?m\\.?)(?![a-z]))?`, 'gi');
  const times = [];
  for (const match of timeText.matchAll(timePattern)) {
    const { start, end } = span(match);
    if (/\d$/.test(timeText.slice(0, start)) || /^(?:[0-9:]|小時|鐘頭)/.test(timeText.slice(end))) continue;
    const before = timeText.slice(0, start).match(/(?:大約|約|大概|左右|差不多|將近|快)\s*$/);
    const after = timeText.slice(end).match(/^\s*(?:左右|前後|多|以前|以後|之前|之後|到|至|前(?!往)|後)/);
    spans.push({ start: start - (before?.[0].length || 0), end: end + (after?.[0].length || 0) });
    const [, period, hour, colon, half, quarters, minutes, unmarked, suffix] = match;
    const h = spokenDiaryNumber(hour);
    const m = half ? 30 : quarters ? spokenDiaryNumber(quarters) * 15 : spokenDiaryNumber(colon || minutes || unmarked || '0');
    const resolved = before || after || (period && suffix) ? '' : spokenReminderTime(h, m, period || suffix, Boolean(colon));
    times.push(resolved);
  }

  const allDay = [...timeText.matchAll(/全天|整天/g)];
  spans.push(...allDay.map(span));
  const distinctTimes = [...new Set(times)];
  let time = distinctTimes.length === 1 && !allDay.length ? distinctTimes[0] : '';
  if (distinctTimes.length > 1 || (allDay.length && times.length)) {
    time = '';
    warnings.push('內容有不同時間，請確認提醒時間。');
  } else if (!time && !allDay.length) {
    warnings.push(times.length ? '請確認時間，像是「早上八點」或「20:00」。' : '請填提醒時間，全天提醒可以留空。');
  }

  const filler = /^(?:[：:\s、，,。！？!?；;]|請(?:在|從)?|幫我(?:在|從)?|麻煩(?:在|從)?|記得|提醒(?:一下)?我|提醒一下|叫我|通知我|加(?:一個)?提醒|新增(?:一個)?提醒|(?:在|從|開始|和|跟|或|以及|白天|早上|中午|下午|晚上)(?=\s))+/;
  const title = maskSpokenDiarySpans(body, spans).replace(filler, '')
    .replace(/[：:\s、，,。！？!?；;]+$/g, '').replace(/\s{2,}/g, ' ').trim();
  if (!title) warnings.push('請補上要提醒的事情。');
  if (title.length > 60) warnings.push('提醒事項最多 60 字，請縮短一點。');
  return { title, date, time, rep, extra, warnings };
}

function spokenReminderUTC(key) {
  return new Date(key + 'T00:00:00Z');
}

function shiftSpokenReminderDate(key, delta) {
  if (!validSpokenDiaryDate(key)) return '';
  const date = spokenReminderUTC(key);
  date.setUTCDate(date.getUTCDate() + delta);
  return date.toISOString().slice(0, 10);
}

function nextSpokenReminderWeekday(key, weekday) {
  if (weekday < 0 || !validSpokenDiaryDate(key)) return '';
  return shiftSpokenReminderDate(key, (weekday - spokenReminderUTC(key).getUTCDay() + 7) % 7);
}

function nextSpokenReminderMonthDay(key, day) {
  if (!Number.isInteger(day) || day < 1 || day > 31 || !validSpokenDiaryDate(key)) return '';
  const month = spokenReminderUTC(key.slice(0, 7) + '-01');
  for (let i = 0; i < 3; i++) {
    const candidate = month.toISOString().slice(0, 7) + '-' + String(day).padStart(2, '0');
    if (validSpokenDiaryDate(candidate) && candidate >= key) return candidate;
    month.setUTCMonth(month.getUTCMonth() + 1);
  }
  return '';
}

function parseSpokenReminderDate(text, todayDate, dayIndex) {
  if (!validSpokenDiaryDate(todayDate)) return '';
  const compact = text.replace(/\s/g, '');
  if (/^(?:今|明|後|大後|隔天|昨|前天)/.test(compact)) {
    const delta = compact.startsWith('明') || compact === '隔天' ? 1
      : compact.startsWith('後') ? 2 : compact.startsWith('大後') ? 3
      : compact.startsWith('昨') ? -1 : compact.startsWith('前') ? -2 : 0;
    return shiftSpokenReminderDate(todayDate, delta);
  }
  const digits = /[0-9零〇○一二兩两三四五六七八九十百]+/g;
  if (compact.endsWith('天後')) {
    const count = spokenDiaryNumber(compact.slice(0, -2));
    return count === null || count > 366 ? '' : shiftSpokenReminderDate(todayDate, count);
  }
  if (/星期|禮拜|週|周/.test(compact)) {
    const weekday = dayIndex(compact[compact.length - 1]);
    if (!/^[下這本上]/.test(compact)) return nextSpokenReminderWeekday(todayDate, weekday);
    const date = spokenReminderUTC(todayDate);
    const mondayOffset = (date.getUTCDay() + 6) % 7;
    const week = compact.startsWith('下') ? 7 : compact.startsWith('上') ? -7 : 0;
    return shiftSpokenReminderDate(todayDate, week - mondayOffset + (weekday + 6) % 7);
  }
  const parts = [...(compact.match(digits) || [])].map(spokenDiaryNumber);
  if ((parts.length !== 2 && parts.length !== 3) || parts.some(value => value === null)) return '';
  const year = parts.length === 3 ? parts.shift() : Number(todayDate.slice(0, 4));
  const suffix = '-' + parts.map(part => String(part).padStart(2, '0')).join('-');
  const candidate = year + suffix;
  if (validSpokenDiaryDate(candidate) && candidate >= todayDate) return candidate;
  if (/年|^\d{4}[-/.]/.test(compact)) return '';
  const next = year + 1 + suffix;
  return validSpokenDiaryDate(next) ? next : '';
}

function spokenReminderTime(hour, minute, period, hasColon) {
  if (hour === null || minute === null || hour > 23 || minute > 59) return '';
  const normalized = (period || '').replace(/\./g, '').toLowerCase();
  let h = hour;
  if (/^(?:am|凌晨|清晨|早上|早晨|上午|今早|明早|早)$/.test(normalized)) {
    if (h > 12) return '';
    if (h === 12) {
      if (normalized === 'am' || normalized === '凌晨') h = 0;
      else return '';
    }
  } else if (/^(?:pm|午後|下午|傍晚|黃昏|晚上|夜間|今晚|明晚|晚)$/.test(normalized)) {
    if (h === 0) return '';
    if (h < 12) h += 12;
  } else if (normalized === '中午') {
    if (h === 1 || h === 2) h += 12;
    else if (h < 11 || h > 14) return '';
  } else if (!hasColon && h >= 1 && h <= 12) {
    return '';
  }
  return String(h).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
}

/* 記帳語句整理 */
function parseSpokenLedger(text, todayDate) {
  const source = String(text || '').trim();
  const phrase = source.replace(/[！-～]/g, char => String.fromCharCode(char.charCodeAt(0) - 0xFEE0));
  const warnings = [];
  const dateSpans = [];
  const dayNumber = '[0-9零〇○一二兩两三四五六七八九十]';
  const datePattern = new RegExp(
    `(?:[0-9]{4}[-/.][0-9]{1,2}[-/.][0-9]{1,2}|(?:${dayNumber}{4}年\\s*)?${dayNumber}{1,4}月\\s*${dayNumber}{1,4}(?:日|號)?|[0-9]{1,2}/[0-9]{1,2})(?![0-9萬万塊元])|今天|今日|今早|今晚|昨天|昨日|昨晚|昨早|前天|前日|前晚|明天|明日|明早|明晚|後天`,
    'g'
  );
  for (const match of phrase.matchAll(datePattern)) {
    const before = phrase.slice(0, match.index);
    const after = phrase.slice(match.index + match[0].length);
    if (/^[0-9]/.test(match[0]) && (/[0-9./-]$/.test(before) || /^(?:\/[0-9]|[-.][0-9])/.test(after))) continue;
    if (match[0] === '7/11' && /(?:去|到|在|進|逛)\s*$/.test(before)) continue;
    dateSpans.push({ start: match.index, end: match.index + match[0].length, date: spokenDiaryDate(match[0], todayDate) });
  }
  const dates = [...new Set(dateSpans.map(span => span.date))];
  const otherDates = /(?:上|下|這|本|前)個?月|(?:禮拜|星期|週|周)[日天一二三四五六1-7]|每(?:天|週|周|星期|月)|(?:前|過)幾天|(?:那|隔)天|[0-9一二三四五六七八九十]+\s*(?:號|日)(?!常|元|用|公車|路線|碼)/;
  const body = maskSpokenDiarySpans(phrase, dateSpans);
  let date = dates.length ? dates[0] : todayDate;
  if (dates.length > 1 || otherDates.test(body) || !validSpokenDiaryDate(date)) {
    date = '';
    warnings.push('請確認這筆記帳的日期。');
  }

  const outAction = /支出|花費|花了|花掉|花錢|買了?|付款|付了|支付|繳了?|刷卡|刷了|扣款|扣了|捐了|給了|轉(?:帳)?給/;
  const inAction = /收入|入帳|進帳|收到|收了|收款|賺了?|領了|獲得獎金|拿到|到帳/;
  const incomeKind = /薪水|薪資|工資|月薪|獎金|年終|分紅|投資收益|利息|股息|股利|配息|退款入帳/;
  const unclearAction = /(?:沒有|沒|未|尚未|不用|不必|不要|別|不是|並非|本來要|打算|預計|想要|想|如果|待|要)\s*(?:去|再)?\s*(?:支出|花費|花|購買|買|付|支?付|繳|刷|收|領|發薪|存|轉|扣|入帳|到帳|進帳)|(?:少|多)\s*(?:收了|收|付了|付|繳了|繳|花了|花)|(?:預算|報價|要價|最多花|至少花|多少錢|應收|應付|未付款)|[?？]\s*$/;

  const categories = {
    out: [
      ['餐飲', /餐飲|午餐|晚餐|早午餐|早餐|午飯|晚飯|早飯|便當|咖啡|飲料|奶茶|手搖|餐廳|外送|伙食|火鍋|消夜|宵夜|點心|餐費|飯糰|包子/],
      ['交通', /交通|油錢|加油|車票|船票|機票|搭船|搭車|捷運|公車|客運|高鐵|火車|計程車|小黃|停車|過路費|運輸費|uber(?!\s*eats)/i],
      ['購物', /購物|網購|蝦皮|衣服|鞋子|褲子|鞋款|化妝品|玩具|買書|文具/],
      ['家用', /家用|水電|電費|水費|瓦斯|房租|管理費|家用品|衛生紙|生活用品|日用品|網路費|手機費|電話費/],
      ['醫療', /醫療|掛號|醫院|診所|看醫生|看診|看牙|回診|醫藥|藥費|買藥|醫師|健保費/],
      ['娛樂', /娛樂|電影|演唱會|展覽|樂園|遊戲|KTV|唱歌/i]
    ],
    in: [
      ['薪水', /薪水|薪資|工資|月薪|底薪/],
      ['獎金', /獎金|年終|分紅|紅包/],
      ['投資', /投資|利息|股息|股利|配息|賣股票/]
    ]
  };
  const findCategories = (type, phrase = body) => categories[type].filter(([, pattern]) => pattern.test(phrase)).map(([name]) => name);

  const hanDigits = '零〇○一二兩两三四五六七八九壹貳贰參叁肆伍陸陆柒捌玖';
  const hanUnits = '十百千萬万億亿拾佰仟';
  const digits = `0-9${hanDigits}`;
  const numerals = digits + hanUnits;
  const amountNumber = `(?:[${numerals}]*[${hanUnits}][${numerals}]*|[0-9]+(?:,[0-9]{3})*|[${hanDigits}]+)(?:[.點点][0-9]+|[.點点][${hanDigits}]+)?`;
  const currency = '(?:新\\s*[臺台]\\s*幣|[臺台]\\s*幣|NT\\s*\\$|NTD|TWD|\\$)';
  const unit = '(?:塊(?:錢)?|元(?:整)?|圓(?:整)?|大洋|新\\s*[臺台]\\s*幣|[臺台]\\s*幣|NTD\\b|TWD\\b)';
  const explicitAmount = new RegExp(`(?:(${currency})\\s*([+-]?\\s*${amountNumber})\\s*(${unit})?|([+-]?\\s*${amountNumber})\\s*(${unit}))(\\s*半)?`, 'gi');
  const candidates = [];
  let uncertainAmount = false;
  const foreign = /美金|美元|美刀|人民幣|日幣|日元|日圓|港幣|港元|澳幣|紐幣|英鎊|歐元|韓元|泰銖|新幣|新加坡幣|馬幣|越南盾|US\s*\$|HK\s*\$|(?:USD|JPY|CNY|RMB|HKD|EUR|AUD|GBP|CAD|KRW|SGD|MYR|THB)\b|[¥€£₩]/i;
  const uncertainBefore = /(?:大約|差不多|將近|快要|快|約莫?|大概|超過|不到|至少|最多|少於|不超過|可能|估計|差|低於|預計|只有?\s*預算|負|負數)\s*(?:是|有)?\s*$/;
  const uncertainAfter = new RegExp(`^\\s*(?:左右|上下|出頭|多(?=\\s*$|[，。,.、\\s])|還沒|嗎|嘛|[~〜～—–-]|(?:到|至|或)\\s*[${numerals}]|[.,]\\s*[0-9])`);

  function captureAmount(match, value, half) {
    const start = match.index;
    const end = start + match[0].length;
    if (candidates.some(item => start < item.end && item.start < end)) return;
    const before = body.slice(0, start);
    const after = body.slice(end);
    const amount = spokenLedgerNumber(value) + (half ? 0.5 : 0);
    if (uncertainBefore.test(before) || uncertainAfter.test(after)
      || /(?:[0-9.%]|[0-9][:,])\s*$/.test(before) || /(?:[0-9零一二三四五六七八九十]+\s*[~〜～—–-]|[-−＋+])\s*$/.test(before)
      || !Number.isFinite(amount) || amount <= 0 || amount > 1e8) {
      uncertainAmount = true;
      return;
    }
    candidates.push({ start, end, amount });
  }

  for (const match of body.matchAll(explicitAmount)) {
    captureAmount(match, match[2] || match[4], match[6]);
  }
  if (!uncertainAmount && !foreign.test(body)) {
    const amountCue = '(?:金額(?:是)?|總共|一共|共花|共付|花費|花了?|刷了|扣了|付了?|支付了?|繳了?|收了?|收到|賺了?|領了?|收入|支出|轉帳)';
    const strongAmount = new RegExp(`${amountCue}[\\s:=]*([+-]?\\s*${amountNumber})(?=\\s*(?:[，,。.!！;；\\n]|$))`, 'g');
    for (const match of body.matchAll(strongAmount)) {
      const valueStart = match.index + match[0].lastIndexOf(match[1]);
      captureAmount({ 0: match[1], index: valueStart }, match[1]);
    }
    const clauses = body.matchAll(/(?:[0-9][,.][0-9]|[^，,。.!！;；\n])+/g);
    const trailingAmount = new RegExp(`(?:^|[^-${numerals}.點点])([+-]?\\s*${amountNumber})(?=\\s*$)`);
    for (const clause of clauses) {
      const match = clause[0].match(trailingAmount);
      if (!match || !(findCategories('out', clause[0]).length || findCategories('in', clause[0]).length)) continue;
      const valueStart = match.index + match[0].lastIndexOf(match[1]);
      if (!/(?:第|訂單|編號|型號|電話)\s*$/.test(clause[0].slice(0, valueStart))) {
        captureAmount({ 0: match[1], index: clause.index + valueStart }, match[1]);
      }
    }
  }

  let amount = candidates.length === 1 ? candidates[0].amount : null;
  const speculative = unclearAction.test(body);
  if (foreign.test(body)) {
    warnings.push('請把金額確認為新台幣再儲存。');
    amount = null;
  } else if (speculative || uncertainAmount) {
    warnings.push('請確認實際發生的金額。');
    amount = null;
  } else if (candidates.length > 1) {
    warnings.push('聽到多個金額，請分開記或確認這一筆的金額。');
  } else if (!amount) {
    warnings.push('請確認新台幣金額。');
  }

  let type = '';
  const outgoing = outAction.test(body);
  const incoming = inAction.test(body);
  const transfer = /ATM|提款|領現金|領錢|存現金|存進|存入|存錢|轉(?:帳)?給(?:我)?自己|自己(?:另)?一個帳戶/i.test(body);
  if (!transfer && !speculative && candidates.length < 2 && !(outgoing && incoming)) {
    if (outgoing) type = 'out';
    else if (incoming || incomeKind.test(body)) type = 'in';
    else if (amount && findCategories('out').length) type = 'out';
  }
  if (!type) warnings.push('請選擇收入或支出。');
  const matches = type ? findCategories(type) : [];
  const cat = type ? matches.length === 1 ? matches[0] : '其他' : '';
  if (matches.length > 1) warnings.push('聽到多種類別，請確認要選的分類。');

  const note = maskSpokenDiarySpans(source, [
    ...(date ? dateSpans : []),
    ...(amount ? candidates : [])
  ])
    .replace(/^[，,。.!！;；、\s]+/u, '')
    .replace(/^\s*(?:幫我|請幫我|我要|請)?\s*(?:新增|記錄|記下|記)(?:一筆|個帳|帳|一下)[，,。.!！;；、\s]*/u, '')
    .replace(/(?:[，,。.!！;；、\s])*(?:金額(?:是)?|總共|一共|共花|共付|花費|花了?|刷了|扣了|付了?|支付了?|繳了?|收了?|收到|賺了?|領了?|收入|支出)[，,。.!！;；、\s]*$/u, '')
    .replace(/^\s*(?:收到|收入|支出|花費|金額是)\s*[：:,，]?\s*/u, '')
    .replace(/^[，,。.!！;；、\s]+|[，,。.!！;；、\s]+$/gu, '')
    .replace(/\s*[，,、；;][\s，,、；;]+/gu, '，')
    .replace(/\s+([，,、；;])/gu, '$1')
    .replace(/\s{2,}/gu, ' ');
  return { type, amount, cat, date, note, warnings };
}

function spokenLedgerNumber(text) {
  const digitPairs = {
    零: '0', 〇: '0', '○': '0', 一: '1', 壹: '1', 二: '2', 貳: '2', 贰: '2', 兩: '2', 两: '2',
    三: '3', 參: '3', 叁: '3', 四: '4', 肆: '4', 五: '5', 伍: '5', 六: '6', 陸: '6', 陆: '6',
    七: '7', 柒: '7', 八: '8', 捌: '8', 九: '9', 玖: '9'
  };
  const normalized = String(text).trim().replace(/,/g, '')
    .replace(/[零〇○一二兩两三四五六七八九壹貳贰參叁肆伍陸陆柒捌玖]/g, char => digitPairs[char])
    .replace(/拾/g, '十').replace(/佰/g, '百').replace(/仟/g, '千')
    .replace(/万/g, '萬').replace(/亿/g, '億').replace(/[點点]/g, '.');
  if (/^\+?\d+(?:\.\d{1,2})?$/.test(normalized)) return Number(normalized);
  const match = normalized.match(/^(\d?億)?([\d千百十]+萬)?([\d千百十]+)?(\.\d{1,2})?$/);
  if (!match || ![match[1], match[2], match[3]].some(Boolean)) return NaN;

  function sectionValue(raw) {
    if (!raw) return 0;
    if (/^\d{1,4}$/.test(raw)) return Number(raw);
    const parts = raw.match(/^(?:0?(\d)千)?(?:0?(\d)百)?(?:0?(\d?)十)?(\d{1,2})?$/);
    if (!parts) return NaN;
    const [, thousands, hundreds, tens, units] = parts;
    if (units?.length === 1 && tens === undefined && (thousands || hundreds)) return NaN;
    if (units?.length === 2 && (units[0] !== '0' || tens !== undefined)) return NaN;
    return Number(thousands || 0) * 1000 + Number(hundreds || 0) * 100
      + (tens === undefined ? 0 : Number(tens || 1) * 10) + Number(units || 0);
  }

  const [, hundredMillion = '', tenThousands = '', rest = '', decimal = ''] = match;
  if (tenThousands && /^[1-9]$/.test(rest)) return NaN;
  return sectionValue(hundredMillion.slice(0, -1)) * 100000000
    + sectionValue(tenThousands.slice(0, -1)) * 10000
    + sectionValue(rest) + Number(decimal || 0);
}

function reviewSpokenComposer(){
  if(spokenMic) return;
  if(!spokenDraft().text.trim()){
    spokenDraft().status = '先說一句，或在框裡輸入想記的事。';
    updateSpokenComposer(); $('#voiceText').focus();
    return;
  }
  const text = spokenDraft().text, date = dkey();
  if(section==='plan'){
    const {extra, ...draft} = parseSpokenReminder(text, date);
    if(extra) draft.title = [draft.title, '備註 '+extra].filter(Boolean).join('，');
    spokenDraft().review = draft;
  }else if(section==='money') spokenDraft().review = parseSpokenLedger(text, date);
  else spokenDraft().review = parseSpokenDiary(text, date);
  spokenDraft().status = '';
  updateSpokenComposer();
  $('#voiceForm')?.scrollIntoView({block:'start'});
  $('#voiceReviewHeading')?.focus({preventScroll:true});
}

function editSpokenRecord(date){
  const record = spokenRecords()[date];
  if(!record || spokenMic) return;
  spokenDraft().review = {date, ...record, warnings:[], editing:true};
  spokenDraft().status = '';
  updateSpokenComposer();
  $('#voiceForm')?.scrollIntoView({block:'start'});
  $('#voiceReviewHeading')?.focus({preventScroll:true});
}

function endSpokenMic(){
  const mic = spokenMic;
  spokenMic = null;
  if(mic){ try { mic.abort(); } catch(_){} }
}

function clearSpokenDrafts(){
  endSpokenMic();
  for(const draft of Object.values(spokenDrafts)){
    draft.text = ''; draft.review = null; draft.status = '';
  }
}

function toggleSpokenMic(){
  const Recognition = spokenMicClass();
  if(!Recognition) return;
  if(spokenMic){
    try { spokenMic.stop(); }
    catch(_){
      endSpokenMic();
      spokenDraft().status = '語音輸入已停止，可以直接編輯文字。';
      updateSpokenComposer();
    }
    return;
  }
  const prefix = spokenDraft().text.trim();
  let heard = false;
  spokenDraft().review = null;
  try{
    const mic = new Recognition();
    spokenMic = mic;
    mic.lang = 'zh-TW';
    mic.interimResults = false;
    mic.onresult = event=>{
      if(spokenMic !== mic) return;
      const text = Array.from(event.results, result=>result[0].transcript).join(' ').trim();
      if(!text) return;
      heard = true;
      spokenDraft().text = [prefix,text].filter(Boolean).join('\n').slice(0,SPOKEN_TEXT_LIMIT);
      updateSpokenComposer();
    };
    mic.onerror = event=>{
      if(spokenMic !== mic) return;
      spokenMic = null;
      spokenDraft().status = event.error === 'no-speech' ? '沒有聽清楚，可以再試一次。' : '目前無法使用網頁麥克風，可以用手機鍵盤的麥克風或直接打字。';
      updateSpokenComposer();
    };
    mic.onend = ()=>{
      if(spokenMic !== mic) return;
      spokenMic = null;
      if(heard) reviewSpokenComposer();
      else { spokenDraft().status = '沒有聽清楚，可以再試一次。'; updateSpokenComposer(); }
    };
    spokenDraft().status = '正在聽妳說話…';
    updateSpokenComposer();
    mic.start();
  }catch(_){
    spokenMic = null;
    spokenDraft().status = '目前無法使用網頁麥克風，可以用手機鍵盤的麥克風或直接打字。';
    updateSpokenComposer();
  }
}

document.addEventListener('input', e=>{
  if(e.target.id === 'voiceText'){
    spokenDraft().text = e.target.value;
    if(spokenDraft().review || spokenDraft().status){
      spokenDraft().review = null;
      spokenDraft().status = '';
      updateSpokenComposer();
    }
  }else if(spokenDraft().review && e.target.form?.id === 'voiceForm'){
    const {name, value} = e.target;
    spokenDraft().review[name] = value;
    if(section==='money' && name==='type'){
      const category = e.target.form.elements.cat;
      const selection = spokenDraft().review.cat;
      category.innerHTML = spokenLedgerCategories(value, selection);
      spokenDraft().review.cat = category.value;
    }
  }
});

function finishSpokenEntry(message){
  spokenDraft().text = '';
  spokenDraft().review = null;
  spokenDraft().status = message;
  render(); toast(message);
}

function saveSpokenReminder({title, date, time, rep}){
  const name = title.value.trim();
  if(!name || name.length>60){ toast('提醒名稱要在 60 字內'); title.focus(); return; }
  if(!validSpokenDiaryDate(date.value) || !Object.keys(REP).includes(rep.value)){
    toast('請確認日期和重複方式'); return;
  }
  if(storeListEntry('events', {title:name, date:date.value, time:time.value, rep:rep.value, done:{}})){
    finishSpokenEntry('提醒已記好 ✓ 想準時響就按該筆旁的 📅');
  }
}

function saveSpokenLedger({type, amount, cat, date, note}){
  const entry = {
    type:type.value, amt:Math.round(amount.valueAsNumber*100)/100,
    cat:cat.value, note:note.value.trim(), date:date.value,
  };
  if(!validSpokenDiaryDate(entry.date) || !(entry.amt>0 && entry.amt<=1e8) ||
    !(CATS[entry.type]||[]).some(([label])=>label===entry.cat)){
    toast('請確認記帳的類型、金額、分類和日期'); return;
  }
  if(entry.note.length>40){ toast('備註要在 40 字內'); note.focus(); return; }
  if(storeListEntry('ledger', entry)){
    mMonth = entry.date.slice(0,7);
    finishSpokenEntry('已記帳 ✓');
  }
}

document.addEventListener('submit', e=>{
  if(e.target.id !== 'voiceForm') return;
  e.preventDefault();
  if(!spokenDraft().review || spokenMic || !S.profile || window.Cloud?.watcher) return;
  const {elements} = e.target;
  if(section==='plan'){ saveSpokenReminder(elements); return; }
  if(section==='money'){ saveSpokenLedger(elements); return; }
  const date = elements.date.value;
  const number = name=>elements[name]?.value ? elements[name].valueAsNumber : null;
  const weight = number('weight'), waist = number('waist'), water = number('water');
  const note = elements.note.value.trim();
  const editing = spokenDraft().review.editing;
  if(!validSpokenDate(date)){ toast('請確認記錄日期'); return; }
  if(!editing && weight === null && waist === null && water === null && !note){
    toast('請填入至少一項紀錄');
    return;
  }

  const records = spokenRecords();
  const current = records[date] || {};
  let savedNote = current.note || '';
  if(editing) savedNote = note;
  else if(note && savedNote !== note && !savedNote.endsWith('\n'+note)){
    savedNote = [savedNote, note].filter(Boolean).join('\n');
  }
  const savedWaist = editing ? waist : waist ?? current.waist ?? null;
  const hasPrivateChange = editing || waist !== null || !!note;
  const hasProgress = weight !== null || water !== null;
  const previousDay = S.days[date], previousUpdatedAt = S.updatedAt;
  let previousPrivate;
  try{
    if(hasPrivateChange){
      previousPrivate = localStorage.getItem(SPOKEN_RECORDS_KEY);
      if(savedWaist !== null || savedNote) records[date] = {waist:savedWaist, note:savedNote};
      else delete records[date];
      localStorage.setItem(SPOKEN_RECORDS_KEY, JSON.stringify(records));
    }
    if(hasProgress){
      const day = {...(previousDay || {water:0, habits:{}})};
      if(weight !== null) day.w = r1(weight);
      if(water !== null) day.water = water;
      if(doneCount(day) < TOTAL) day.perfect = false;
      S.days[date] = day;
      save();
    }
  }catch(_){
    if(previousDay) S.days[date] = previousDay; else delete S.days[date];
    S.updatedAt = previousUpdatedAt;
    if(previousPrivate !== undefined){
      try{
        if(previousPrivate === null) localStorage.removeItem(SPOKEN_RECORDS_KEY);
        else localStorage.setItem(SPOKEN_RECORDS_KEY, previousPrivate);
      }catch(_){}
    }
    toast('儲存失敗，請確認裝置空間後再試一次');
    return;
  }

  if(hasPrivateChange) window.dispatchEvent(new Event('qq-spoken-saved'));
  if(!editing) spokenDraft().text = '';
  spokenDraft().review = null;
  spokenDraft().status = `已記錄 ${dateLabel(date)} ✓`;
  if(date === dkey() && hasProgress) afterProgress(true); else render();
  if(weight !== null) checkUnlock();
  toast(spokenDraft().status);
});

/* ========== 計算 ========== */
function doneCount(day){
  if(!day) return 0;
  let n = 0;
  if(day.w) n++;
  if((day.water||0) >= WATER_GOAL) n++;
  HABITS.forEach(h=>{ if(day.habits && day.habits[h.id]) n++; });
  return n;
}
const TOTAL = 2 + HABITS.length;
function active(day){ return day && (day.w || day.water || day.mood || Object.values(day.habits||{}).some(Boolean)); }

// 連續天數：每 7 天可以有 1 天「請假」不中斷（寬容，不給壓力）
function streak(){
  const keys = Object.keys(S.days).filter(k=>active(S.days[k])).sort();
  if(!keys.length) return {n:0, rest:false};
  const first = parseKey(keys[0]);
  let d = new Date(); d.setHours(0,0,0,0);
  if(!active(S.days[dkey(d)])) d = addDays(d,-1);
  let n=0, lastSkip=null, k=0, usedRest=false;
  while(d >= first){
    if(active(S.days[dkey(d)])) n++;
    else if(lastSkip===null || k-lastSkip>=7){ lastSkip=k; usedRest=true; }
    else break;
    d = addDays(d,-1); k++;
  }
  return {n, rest:usedRest};
}

// 趨勢體重（指數平滑）：把每天的上下起伏抹平，看真正的方向
function weights(){
  return Object.keys(S.days).filter(k=>S.days[k].w).sort().map(k=>({k, w:S.days[k].w}));
}
function trendSeries(){
  const ws = weights(); let t=null;
  return ws.map(p=>{ t = t===null ? p.w : t + 0.2*(p.w - t); return {...p, t}; });
}
function stats(){
  const p = S.profile, ts = trendSeries();
  const cur = ts.length ? ts[ts.length-1].t : p.start;
  const last = ts.length ? ts[ts.length-1].w : p.start;
  const lost = Math.max(0, p.start - cur);
  const goalLoss = p.start - p.goal;
  const remain = Math.max(0, cur - p.goal);
  // 最近 14 天的每週速度
  let rate = null;
  if(ts.length >= 3){
    const lastD = parseKey(ts[ts.length-1].k);
    const ref = ts.slice().reverse().find(x => (lastD - parseKey(x.k))/864e5 >= 7) || ts[0];
    const days = (lastD - parseKey(ref.k))/864e5;
    if(days >= 4) rate = (ref.t - cur) / days * 7;
  }
  return {cur, last, lost, goalLoss, remain, rate, ts};
}
function checkUnlock(){
  const {lost} = stats();
  const kg = Math.min(10, Math.floor(lost + 1e-9));
  if(kg > (S.unlocked||0)){
    S.unlocked = kg; save(); render();
    const r = REWARDS[kg-1];
    setTimeout(()=>{
      confetti(kg===10 ? ['👑','🎉','💖','✨'] : [r.e,'🎉','✨']);
      modal(r.e, kg===10 ? '目標達成！！' : `減掉 ${kg} 公斤！`,

}

function chart(ts){
  if(ts.length < 2) return '<div class="muted" style="padding:30px 0;text-align:center">記錄兩天以上就會出現曲線 ✏️</div>';
  let pts = ts;
  if(chartRange){ const from = addDays(new Date(), -chartRange); pts = ts.filter(x=>parseKey(x.k) >= from); if(pts.length<2) pts = ts.slice(-2); }
  const W=340,H=180,L=34,R=10,T=12,B=24;
  const t0 = parseKey(pts[0].k), t1 = parseKey(pts[pts.length-1].k);
  const span = Math.max(1,(t1-t0)/864e5);
  let vals = pts.flatMap(x=>[x.w,x.t]); let lo=Math.min(...vals), hi=Math.max(...vals);
  const goal = S.profile.goal; const showGoal = goal >= lo-1.5;
  if(showGoal) lo = Math.min(lo, goal);
  lo = Math.floor(lo-0.5); hi = Math.ceil(hi+0.5);
  const x = k => L + ((parseKey(k)-t0)/864e5)/span*(W-L-R);
  const y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  const step = Math.max(1, Math.ceil((hi-lo)/4));
  let grid=''; for(let v=hi; v>=lo; v-=step){ grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#f1e4dd"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#9a8580">${v}</text>`; }
  const line = pts.map((p,i)=>(i?'L':'M')+x(p.k).toFixed(1)+' '+y(p.t).toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${x(p.k)}" cy="${y(p.w)}" r="3" fill="#ffcfb8"/>`).join('');
  const g = showGoal ? `<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#4fbf98" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(goal)-4}" font-size="10" text-anchor="end" fill="#4fbf98">目標 ${fmt(goal)}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${g}${dots}
    <path d="${line}" fill="none" stroke="#f28c6a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="#9a8580">${dateLabel(pts[0].k)}</text>
    <text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" fill="#9a8580">${dateLabel(pts[pts.length-1].k)}</text></svg>`;
}

document.addEventListener('click', async e=>{
  const button = e.target.closest?.('#managementAccess [data-owner-access]');
  const C = window.Cloud;
  if(!button || !C?.user || C.watcher || !C.access || ownerAccessRequest) return;
  const {uid} = C.user;
  const {manage, shareSpoken} = C.access;
  const address = QQ.watchers[0];
  const messages = {
    grant: !manage && {
      manage:true, share:false,
      prompt:`開啟後，${address} 可以查看、修改或刪除妳已同步的日記、提醒和記帳。確定開啟嗎？`,
      done:'管理權限已開啟。',
    },
    revoke: manage && {
      manage:false, share:false,
      prompt:'要收回管理權限並停止分享腰圍與語音補充筆記嗎？',
      done:'已收回管理權限。',
    },
    share: manage && (!shareSpoken || !C.canShareOnThisDevice()) && {
      manage:true, share:true,
      prompt:`要讓 ${address} 查看這台裝置目前和之後記下的腰圍與語音補充筆記嗎？`,
      done:'已分享這台裝置的腰圍與語音補充筆記。',
    },
    unshare: manage && shareSpoken && {
      manage:true, share:false,
      done:'已停止分享腰圍與語音補充筆記。',
    },
  };
  const next = messages[button.dataset.ownerAccess];
  if(!next || (next.prompt && !confirm(next.prompt))) return;
  const request = {uid};
  ownerAccessRequest = request;
  ownerAccessFeedback = null;
  updateOwnerManagementAccess();
  try{
    const result = await C.setAccess(next.manage, next.share);
    if(result === false) throw new Error('Access update failed');
    if(C.user?.uid === uid){
      ownerAccessFeedback = {uid, text:next.done};
    }
  }catch(_){
    if(C.user?.uid === uid){
      ownerAccessFeedback = {uid, text:'無法儲存權限設定，請確認網路後再試。', error:true};
    }
  }finally{
    if(ownerAccessRequest === request) ownerAccessRequest = null;
    updateOwnerManagementAccess();
  }
});

let MANAGER = null;
let managerOwner = '';
let managerTab = 'day';
let managerLimit = 30;
let managerBusy = false;
const MANAGER_TABS = {day:'日記', event:'提醒', ledger:'記帳', voice:'分享筆記'};

function setManagerState(state){
  MANAGER = state;
  const dialog = $('#managerEdit');
  if(!state || (!state.loading && dialog && !state.list?.some(owner=>owner.id===dialog.dataset.owner))){
    dialog?.close();
    if(!state){ managerOwner = ''; managerTab = 'day'; managerLimit = 30; }
  }
  render();
}

function managerList(owner, kind){
  if(kind==='voice') return Object.entries(owner.voice||{})
    .filter(([date,row])=>validSpokenDiaryDate(date) && row && (Number.isFinite(row.waist) || row.note))
    .sort(([a],[b])=>b.localeCompare(a));
  if(kind==='day') return Object.entries(owner.data.days||{})
    .filter(([date,day])=>validSpokenDiaryDate(date) && day && !day.del &&
      (active(day) || day.note || day.walkDone || day.trainDone ||
        [day.ate, day.vdone].some(items=>Object.values(items||{}).some(Boolean))))
    .sort(([a],[b])=>b.localeCompare(a));
  const list = owner.data[kind==='event'?'events':'ledger'];
  return live(Array.isArray(list)?list:[]).filter(entry=>entry.id)
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')) || (b.u||0)-(a.u||0))
    .map(entry=>[entry.id,entry]);
}

function managerDayBody(row){
  const labels = [];
  if(Number.isFinite(row.w) && row.w>0) labels.push('體重 '+fmt(row.w)+' 公斤');
  if(Number.isFinite(row.water)) labels.push('喝水 '+row.water+' 杯');
  if(row.mood) labels.push('心情 '+row.mood);
  const habits = HABITS.filter(({id})=>row.habits?.[id]).map(({t})=>t);
  if(habits.length) labels.push('習慣 '+habits.join('、'));
  if(row.walkDone) labels.push('已走路');
  if(row.trainDone) labels.push('已做訓練');
  const workouts = Object.values(row.vdone||{}).filter(Boolean).length;
  if(workouts) labels.push('跟練影片 '+workouts+' 支');
  const meals = Object.values(row.ate||{}).filter(Boolean).length;
  if(meals) labels.push('已記下 '+meals+' 餐');
  return (labels.length?`<p>${esc(labels.join(' ・ '))}</p>`:'') + (row.note?`<p class="manager-note">${esc(row.note)}</p>`:'');
}

function managerMoney(amount){
  return 'NT$ '+Number(amount).toLocaleString('zh-TW',{maximumFractionDigits:2});
}

function managerRow(kind, key, row){
  let title = key, body = '';
  if(kind==='day') body = managerDayBody(row);
  if(kind==='event'){
    title = row.title || '提醒';
    body = `<p>${esc(row.date)} ・ ${esc(row.time||'全天')} ・ ${esc(REP[row.rep]||REP.none)}</p>`;
    const done = Object.keys(row.done||{}).filter(date=>row.done[date]).length;
    if(done) body += `<p>已完成 ${done} 次</p>`;
  }
  if(kind==='ledger'){
    title = `${row.type==='in'?'收入':'支出'} ${managerMoney(row.amt)}`;
    body = `<p>${esc(row.date)} ・ ${esc(row.cat)}</p>${row.note?`<p class="manager-note">${esc(row.note)}</p>`:''}`;
  }
  if(kind==='voice'){
    body = (Number.isFinite(row.waist)?`<p>腰圍 ${fmt(row.waist)} 公分</p>`:'') +
      (row.note?`<p class="manager-note">${esc(row.note)}</p>`:'');
  }
  return `<li class="manager-row"><div class="manager-record"><strong>${esc(title)}</strong>${body}</div>
    ${kind==='voice'?'':`<button class="btn ghost small" type="button" data-manager="edit" data-key="${esc(key)}" aria-label="管理 ${esc(title)}">管理</button>`}</li>`;
}

function managerEdit(trigger, owner, kind, key){
  if(managerBusy || kind==='voice' || $('#managerEdit')) return;
  const row = managerList(owner,kind).find(([id])=>id===key)?.[1];
  if(!row) return;
  const dialog = document.createElement('dialog');
  dialog.id = 'managerEdit';
  dialog.className = 'manager-dialog';
  dialog.dataset.owner = owner.id;
  dialog.setAttribute('aria-labelledby','managerEditTitle');
  dialog.innerHTML = `<form>
    <h2 id="managerEditTitle" tabindex="-1">修改${MANAGER_TABS[kind]}${kind==='day'?' ・ '+esc(key):''}</h2>
    ${managerEditFields(kind,row)}
    <p class="warn" role="alert" hidden></p>
    <button type="submit" class="btn">儲存修改</button>
    <div class="row2"><button type="button" class="btn ghost manager-delete">刪除</button><button type="button" class="btn ghost manager-cancel">取消</button></div>
  </form>`;
  const form = dialog.querySelector('form'), fields = form.elements;
  const error = dialog.querySelector('.warn');
  const reportError = message=>{ error.textContent = message; error.hidden = false; };
  const userId = window.Cloud.user?.uid;
  async function submit(changes){
    if(managerBusy) return;
    managerBusy = true;
    const controls = [...fields];
    controls.forEach(control=>{ control.disabled = true; });
    error.hidden = true;
    try{
      await window.Cloud.manage(owner.id, kind, key, changes, row);
      dialog.close();
      if(window.Cloud.user?.uid!==userId || !window.Cloud.watcher) return;
      toast(changes?'已儲存修改':'已刪除紀錄');
      await window.Cloud.loadManager();
    }catch(e){
      if(!dialog.open) return;
      reportError(e?.code==='permission-denied'?'無法修改這筆紀錄。請重新整理，確認管理權限。':(e?.message||'儲存失敗，請再試一次。'));
    }finally{
      controls.forEach(control=>{ control.disabled = false; });
      managerBusy = false;
    }
  }
  if(kind==='ledger') fields.type.addEventListener('change',()=>{
    fields.cat.innerHTML = spokenOptions(CATS[fields.type.value].map(([c])=>[c,c]),'其他');
  });
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(kind==='day'){
      void submit({w:fields.w.value===''?null:fields.w.valueAsNumber,water:fields.water.valueAsNumber,mood:fields.mood.value||null,note:fields.note.value});
    }else if(kind==='event'){
      const title = fields.title.value.trim();
      if(!title){ reportError('請填寫提醒事項。'); fields.title.focus(); return; }
      void submit({title,date:fields.date.value,time:fields.time.value,rep:fields.rep.value});
    }else{
      void submit({type:fields.type.value,amt:Math.round(fields.amt.valueAsNumber*100)/100,cat:fields.cat.value,date:fields.date.value,note:fields.note.value.trim()});
    }
  });
  dialog.querySelector('.manager-cancel').addEventListener('click',()=>dialog.close());
  dialog.querySelector('.manager-delete').addEventListener('click',()=>{
    const description = kind==='day'?`${key} 的日記`:kind==='event'?`提醒「${row.title}」`:`${row.date} 的 ${managerMoney(row.amt)} 記帳`;
    if(confirm(`確定刪除${description}？`)) void submit(null);
  });
  dialog.addEventListener('cancel',e=>{ if(managerBusy) e.preventDefault(); });
  dialog.addEventListener('close',()=>{ dialog.remove(); if(trigger.isConnected) trigger.focus(); });
  document.body.appendChild(dialog);
  dialog.showModal();
  dialog.querySelector('h2').focus();
}

const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const live = a => (a||[]).filter(x=>!x.del);
function storeListEntry(key, fields){
  const previous = S[key], previousUpdatedAt = S.updatedAt;
  S[key] = [...(previous||[]), {...fields, id:uid(), u:Date.now()}];
  try{ save(); return true; }
  catch(_){
    S[key] = previous; S.updatedAt = previousUpdatedAt;

// 合併有 id 的清單：同一筆以「最後修改」的為主，刪除也會同步
function mergeList(a, b){
  const m = new Map();
  [...(a||[]), ...(b||[])].forEach(x=>{ const o = m.get(x.id); if(!o || (x.u||0) > (o.u||0)) m.set(x.id, x); });
  return [...m.values()];
}

/* ---------- 📅 提醒 ---------- */
const REP = {none:'不重複', daily:'每天', weekly:'每週', monthly:'每月'};
function occursOn(ev, k){
  if(k < ev.date) return false;
  if(ev.rep==='daily') return true;
  if(ev.rep==='weekly') return parseKey(k).getDay() === parseKey(ev.date).getDay();
  if(ev.rep==='monthly') return parseKey(k).getDate() === parseKey(ev.date).getDate();
  return k === ev.date;
}
function itemsOn(k){
  return live(S.events).filter(ev=>occursOn(ev,k)).sort((a,b)=> (a.time||'99') < (b.time||'99') ? -1 : 1);
}
function overdue(){
  const t = dkey(), lim = dkey(addDays(new Date(), -14));
  return live(S.events).filter(ev=>ev.rep==='none' && ev.date < t && ev.date >= lim && !(ev.done||{})[ev.date]);
}
function planItem(ev, k, late){
  const done = (ev.done||{})[k];
  return `<div class="pit ${done?'done':''}">
    <div class="tm">${ev.time||'全天'}</div>
    <div class="tt">${esc(ev.title)}${ev.rep!=='none'?`<span class="tag">${REP[ev.rep]}</span>`:''}${late?`<span class="tag late">過期 ${dateLabel(k)}</span>`:''}</div>
    <button class="mini" data-x="pics" data-id="${ev.id}" title="加到手機行事曆">📅</button>
    <button class="mini" data-x="pdel" data-id="${ev.id}" title="刪除">🗑</button>
    <button class="mini ${done?'on':''}" data-x="pdone" data-id="${ev.id}" data-k="${k}" title="完成">✓</button></div>`;
}
function renderPlan(){
  const t = dkey(), tm = dkey(addDays(new Date(),1));
  const nextH = pad(Math.min(23, new Date().getHours()+1)) + ':00';
  const todayList = overdue().map(ev=>planItem(ev, ev.date, true)).join('') + itemsOn(t).map(ev=>planItem(ev, t)).join('');
  const tmList = itemsOn(tm).map(ev=>planItem(ev, tm)).join('');
  let later = '';
  for(let i=2;i<=30;i++){
    const k = dkey(addDays(new Date(), i));
    const its = itemsOn(k).filter(ev=>ev.rep==='none' || ev.rep==='monthly' || (ev.rep==='weekly' && i<=7));
    if(its.length) later += `<div class="lday">${dateLabel(k)}（${'日一二三四五六'[parseKey(k).getDay()]}）</div>` + its.map(ev=>planItem(ev,k)).join('');
  }
  const daily = live(S.events).filter(ev=>ev.rep==='daily');
  return `<div class="top"><div><div class="hello">📅 提醒</div><div class="date">記下要做的事，做完點 ✓</div></div></div>
  ${renderSpokenComposer()}
  <div class="card pform">
    <label class="f">要做什麼<input id="pTitle" maxlength="60" placeholder="例如：回診、繳電費、接小孩"></label>
    <div class="r"><label class="f">日期<input id="pDate" type="date" value="${t}"></label>
    <label class="f">時間<input id="pTime" type="time" value="${nextH}"></label></div>
    <label class="f">重複<select id="pRep">${Object.entries(REP).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
    <button class="btn" data-x="padd">＋ 新增提醒</button>
  </div>
  <div class="card"><div class="pgrp">今天</div>${todayList || '<div class="muted">今天沒有提醒，好好休息 ☕</div>'}</div>
  <div class="card"><div class="pgrp">明天</div>${tmList || '<div class="muted">明天還沒有提醒</div>'}</div>
  ${later ? `<div class="card"><div class="pgrp">之後 30 天</div>${later}${daily.length?`<div class="muted" style="margin-top:8px">每天重複的 ${daily.length} 件不列在這裡</div>`:''}</div>` : ''}
  <div class="muted" style="text-align:center;margin:-2px 8px 20px;line-height:1.6">想讓手機準時響？按每筆旁邊的 📅，加到手機行事曆就會跳通知</div>`;
}
function eventICS(ev){
  const [y,mo,d] = ev.date.split('-'), [h,mi] = (ev.time||'09:00').split(':');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const rr = {daily:'RRULE:FREQ=DAILY', weekly:'RRULE:FREQ=WEEKLY', monthly:'RRULE:FREQ=MONTHLY'}[ev.rep];
  const safe = String(ev.title).replace(/[\\,;]/g, m=>'\\'+m).replace(/\n/g,' ');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//qingqing-diary//ZH-TW','BEGIN:VEVENT',
    `UID:qq-ev-${ev.id}@qingqing-diary`, `DTSTAMP:${stamp}`, `DTSTART:${y}${mo}${d}T${h}${mi}00`, 'DURATION:PT15M',
    ...(rr?[rr]:[]), `SUMMARY:${safe}`, 'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M',`DESCRIPTION:${safe}`,'END:VALARM','END:VEVENT','END:VCALENDAR'];
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `提醒-${String(ev.title).slice(0,12)}.ics`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  toast('打開檔案、按「加入」就會準時提醒 📅');
}
function todayPlanBar(){
  const n = itemsOn(dkey()).filter(ev=>!(ev.done||{})[dkey()]).length + overdue().length;
  return n ? `<button class="todaybar" data-sec="plan" style="width:100%;text-align:left">📅 <span style="flex:1">今天還有 <b>${n}</b> 件提醒要做</span><span class="muted">看看 ›</span></button>` : '';
}

/* ---------- 💰 記帳 ---------- */
const CATS = {
  out: [['餐飲','🍱'],['交通','🚗'],['購物','🛍️'],['家用','🏠'],['醫療','💊'],['娛樂','🎉'],['其他','📦']],
  in:  [['薪水','💼'],['獎金','🎁'],['投資','📈'],['其他','📦']],
};
const catEmoji = (t,c)=> ((CATS[t]||[]).find(x=>x[0]===c)||['','📦'])[1];
let mType = 'out', mCat = '餐飲', mMonth = dkey().slice(0,7);
const money = n => 'NT$ ' + Math.round(n).toLocaleString();
function catChips(t, sel){ return CATS[t].map(([c,e])=>`<button data-x="mcat" data-c="${c}" class="${c===sel?'on':''}">${e} ${c}</button>`).join(''); }
function renderMoney(){
  const list = live(S.ledger).filter(x=>x.date.slice(0,7)===mMonth).sort((a,b)=> a.date===b.date ? (b.u||0)-(a.u||0) : a.date < b.date ? 1 : -1);
  const inSum = list.filter(x=>x.type==='in').reduce((a,x)=>a+x.amt,0);
  const outSum = list.filter(x=>x.type==='out').reduce((a,x)=>a+x.amt,0);
  const byCat = {}; list.filter(x=>x.type==='out').forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.amt);
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const [y,m] = mMonth.split('-').map(Number);
  let rows = '', lastD = '';
  list.forEach(x=>{
    if(x.date!==lastD){ lastD = x.date; rows += `<div class="lday">${dateLabel(x.date)}（${'日一二三四五六'[parseKey(x.date).getDay()]}）</div>`; }
    rows += `<button class="lit" data-x="medit" data-id="${x.id}"><span class="le">${catEmoji(x.type,x.cat)}</span>
      <span class="lt">${esc(x.cat)}${x.note?`<small>${esc(x.note)}</small>`:''}</span>
      <span class="lv ${x.type==='in'?'in-c':'out-c'}">${x.type==='in'?'+':'−'}${Math.round(x.amt).toLocaleString()}</span></button>`;
  });
  return `<div class="top"><div><div class="hello">💰 記帳</div><div class="date">金額 → 分類 → 存，三步完成</div></div></div>
  ${renderSpokenComposer()}
  <div class="card">
    <div class="ttog"><button data-x="mtype" data-t="out" class="out ${mType==='out'?'on':''}">支出</button><button data-x="mtype" data-t="in" class="in ${mType==='in'?'on':''}">收入</button></div>
    <div class="amt"><span>NT$</span><input id="mAmt" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    <div class="cats" id="mCats">${catChips(mType, mCat)}</div>
    <div class="mrow2"><input id="mNote" maxlength="40" placeholder="備註（可不填）"><input id="mDate" type="date" value="${dkey()}"></div>
    <button class="btn" data-x="madd">記一筆</button>
  </div>
  <div class="card">
    <div class="mnav"><button class="mini" data-x="mprev">‹</button><b>${y} 年 ${m} 月</b><button class="mini" data-x="mnext">›</button></div>
    <div class="msum"><div><small>收入</small><b class="in-c">${Math.round(inSum).toLocaleString()}</b></div><div><small>支出</small><b class="out-c">${Math.round(outSum).toLocaleString()}</b></div><div><small>結餘</small><b>${Math.round(inSum-outSum).toLocaleString()}</b></div></div>
  </div>
  ${cats.length ? `<div class="card"><h3>錢花在哪 <small>這個月的支出</small></h3>${cats.map(([c,v])=>`<div class="cbar"><span class="cn">${catEmoji('out',c)} ${esc(c)}</span><span class="cb"><i style="width:${Math.max(3,v/max*100)}%"></i></span><span class="cv">${Math.round(v).toLocaleString()}・${Math.round(v/outSum*100)}%</span></div>`).join('')}</div>` : ''}
  <div class="card"><h3>明細 <small>點一筆可以修改</small></h3>${rows || '<div class="muted">這個月還沒有紀錄</div>'}</div>`;
}
function editEntry(x){
  closeModal();
  const m = document.createElement('div'); m.className='mask'; m.id='mask';
  m.innerHTML = `<div class="modal" style="text-align:left"><h2 style="text-align:center">修改這一筆</h2>
    <div class="ttog"><button data-x="etype" data-t="out" class="out ${x.type==='out'?'on':''}">支出</button><button data-x="etype" data-t="in" class="in ${x.type==='in'?'on':''}">收入</button></div>
