document.addEventListener('click', e=>{
  const sb = e.target.closest('[data-sec]');
  if(sb){
    if(section!==sb.dataset.sec && spokenMic){ endSpokenMic(); spokenDraft().status = ''; }
    section = sb.dataset.sec; localStorage.setItem('qq-section', section); render(); window.scrollTo(0,0); return;
  }
  const el = e.target.closest('[data-x]'); if(!el) return;
  const x = el.dataset.x, now = Date.now();
  S.events = S.events || []; S.ledger = S.ledger || [];
  const findE = id => S.events.find(v=>v.id===id), findL = id => S.ledger.find(v=>v.id===id);
  switch(x){
    case 'padd': {
      const title = $('#pTitle').value.trim(), date = $('#pDate').value, time = $('#pTime').value;
      if(!title){ toast('先寫要做什麼'); $('#pTitle').focus(); return; }
      if(!date){ toast('選一下日期'); return; }
      if(storeListEntry('events', {title, date, time, rep:$('#pRep').value, done:{}})){
        render(); toast('記好了 ✓ 想準時響就按 📅');
      } break; }
    case 'pdone': { const ev = findE(el.dataset.id); if(!ev) return; ev.done = ev.done||{}; ev.done[el.dataset.k] = !ev.done[el.dataset.k]; ev.u = now; save(); render(); if(ev.done[el.dataset.k]) toast('完成一件，好棒 ✨'); break; }
    case 'pdel': { const ev = findE(el.dataset.id); if(!ev) return;
      if(!confirm(`刪除「${ev.title}」${ev.rep!=='none'?'（之後重複的也會一起刪掉）':''}？`)) return;
      ev.del = true; ev.u = now; save(); render(); toast('刪掉了'); break; }
    case 'pics': { const ev = findE(el.dataset.id); if(ev) eventICS(ev); break; }
    case 'mtype': { mType = el.dataset.t; mCat = CATS[mType][0][0];
      document.querySelectorAll('[data-x=mtype]').forEach(b=>b.classList.toggle('on', b.dataset.t===mType));
      $('#mCats').innerHTML = catChips(mType, mCat); break; }
    case 'mcat': { mCat = el.dataset.c; $('#mCats').innerHTML = catChips(mType, mCat); break; }
    case 'madd': {
      const amt = Math.round(parseFloat($('#mAmt').value)*100)/100;
      if(!(amt > 0)){ toast('先輸入金額'); $('#mAmt').focus(); return; }
      if(amt > 1e8){ toast('金額好像太大了，再確認一下'); return; }
      const date = $('#mDate').value || dkey();
      if(storeListEntry('ledger', {type:mType, amt, cat:mCat, note:$('#mNote').value.trim(), date})){
        mMonth = date.slice(0,7); render();
        toast(`${mType==='in'?'收入':'支出'} ${Math.round(amt).toLocaleString()} 記好了 ✓`);
      } break; }
    case 'mprev': case 'mnext': { const [y,m] = mMonth.split('-').map(Number); const d = new Date(y, m-1 + (x==='mnext'?1:-1), 1); mMonth = d.getFullYear()+'-'+pad(d.getMonth()+1); render(); break; }
    case 'medit': { const it = findL(el.dataset.id); if(it) editEntry(it); break; }
    case 'etype': { const t = el.dataset.t; document.querySelectorAll('[data-x=etype]').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
      const c = $('#eCats'); c.dataset.t = t; c.innerHTML = catChips(t, CATS[t][0][0]).replace(/data-x="mcat"/g,'data-x="ecat"'); break; }
    case 'ecat': { const c = $('#eCats'); c.innerHTML = catChips(c.dataset.t, el.dataset.c).replace(/data-x="mcat"/g,'data-x="ecat"'); break; }
    case 'esave': { const it = findL(el.dataset.id); if(!it) return;
      const amt = Math.round(parseFloat($('#eAmt').value)*100)/100;
      if(!(amt > 0)){ toast('金額要大於 0'); return; }
      const c = $('#eCats'), on = c.querySelector('.on');
      Object.assign(it, {type:c.dataset.t, amt, cat: on ? on.dataset.c : CATS[c.dataset.t][0][0], note:$('#eNote').value.trim(), date:$('#eDate').value || it.date, u:now});
      closeModal(); save(); render(); toast('改好了 ✓'); break; }
    case 'edel': { const it = findL(el.dataset.id); if(!it || !confirm('確定刪除這一筆？')) return; it.del = true; it.u = now; closeModal(); save(); render(); toast('刪掉了'); break; }
  }
});

/* ========== 主繪製 ========== */
function render(){
  const app = $('#app');
  if(window.Cloud && Cloud.watcher){ clearSpokenDrafts(); $('#tabs').classList.add('hide'); app.innerHTML = renderManager(); return; }
  if(section==='diary' && tab!=='today' && spokenMic){
    endSpokenMic(); spokenDraft().status = '';
  }
  if(!S.profile){ app.innerHTML = renderOnboard(); $('#tabs').classList.add('hide'); bindGoalHint(); return; }
  $('#tabs').classList.toggle('hide', section!=='diary');
  if(section==='plan'){ app.innerHTML = segBar() + renderPlan(); drawCloudDot(); return; }
  if(section==='money'){ app.innerHTML = segBar() + renderMoney(); drawCloudDot(); return; }
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  app.innerHTML = segBar() + (tab==='today'?renderToday(): tab==='weight'?renderWeight(): tab==='collect'?renderCollect(): renderSettings());
  if(tab==='settings') bindGoalHint();
  drawCloudDot();
  const note = $('#note');
  if(note) note.addEventListener('input', ()=>{ today().note = note.value; save(); });
}
function bindGoalHint(){
  const st = $('#pStart'), g = $('#pGoal');
  if(st && g) st.addEventListener('input', ()=>{ const v=parseFloat(st.value); if(v>30 && !g.dataset.touched) g.value = fmt(v-10); });
  if(g) g.addEventListener('input', ()=> g.dataset.touched = 1);
}

/* ========== 互動 ========== */
function afterProgress(saved = false){
  if(!saved) save();
  const day = today();
  if(!day.outing && doneCount(day) >= OUTING_AT){
    day.outing = true;
    const cheer = (S.profile.cheer||[]).filter(Boolean);
    const seen = new Set((S.postcards||[]).map(c=>c.t));
    let pool = POSTCARDS.filter(t=>!seen.has(t));
    if(!pool.length) pool = POSTCARDS;
    let text = pick(pool), from = S.profile.pet;

  render();
}

/* ========== 跟練計時 ========== */
let T = null;
function beep(freq=880, ms=160){
  try{ T.ac = T.ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=T.ac.createOscillator(), g=T.ac.createGain(); o.frequency.value=freq; o.connect(g); g.connect(T.ac.destination);
    g.gain.setValueAtTime(.2,T.ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,T.ac.currentTime+ms/1000); o.start(); o.stop(T.ac.currentTime+ms/1000);
  }catch(_){}
  if(navigator.vibrate) navigator.vibrate(120);
}
function startTrain(){
  const p = workoutPlan(), seq = [];
  for(let r=1;r<=p.rounds;r++) p.moves.forEach((id,i)=>{
    seq.push({type:'work', id, r, sec:p.work});
    const last = r===p.rounds && i===p.moves.length-1;
    if(!last) seq.push({type:'rest', id:p.moves[(i+1)%p.moves.length], r, sec:p.rest});
  });
  T = {p, seq, i:-1, left:0, paused:false, ac:T&&T.ac};
  closeModal();
  const m = document.createElement('div'); m.className='mask'; m.id='mask';
  m.innerHTML = `<div class="modal timer" id="tbox"></div>`;
  document.body.appendChild(m);
  next(); T.iv = setInterval(()=>{ if(!T.paused){ T.left--; tick(); } }, 1000);
}
function next(){
  T.i++;
  if(T.i >= T.seq.length) return finishTrain();
  const s = T.seq[T.i]; T.left = s.sec; T.total = s.sec;
  beep(s.type==='work'?880:520, 220);
  drawTimer();
}
function tick(){ if(!T) return; if(T.left <= 0) return next(); if(T.left <= 3) beep(660,90); drawTimer(); }
function drawTimer(){
  const s = T.seq[T.i], mv = MOVES[s.id], box = $('#tbox'); if(!box) return;
  const rest = s.type==='rest';
  box.innerHTML = `
    <div class="muted">第 ${s.r} / ${T.p.rounds} 輪　·　${T.i+1} / ${T.seq.length}</div>
    <div class="em">${rest?'😮‍💨':mv.e}</div>
    <h2>${rest?'休息一下，下一個：'+mv.n:mv.n}</h2>
    <p class="muted">${rest?'喝口水、深呼吸':esc(mv.how)}</p>
    <div class="count ${rest?'rest':''}">${T.left}</div>
    <div class="bar"><i style="width:${(1-T.left/T.total)*100}%"></i></div>
    <div class="muted">${rest?'':pick(['做得好！','慢慢來，動作做對比較重要','圓圓陪妳一起 💪','呼吸不要停喔'])}</div>
    <div class="row2"><button class="btn ghost" data-act="tpause">${T.paused?'▶ 繼續':'⏸ 暫停'}</button><button class="btn ghost" data-act="tskip">跳過 ⏭</button></div>
    <button class="btn ghost" style="background:none" data-act="tstop">先結束</button>`;
}
function stopTrain(){ if(T){ clearInterval(T.iv); } closeModal(); }
function finishTrain(){
  clearInterval(T.iv); closeModal();
  const day = today(); day.trainDone = true; syncWorkout(day);
  beep(1046,300);
  afterProgress();
  setTimeout(()=>{ confetti(['💪','✨','🎉']); if(!$('#mask')) modal('💪','做完了！', `${esc(S.profile.pet)}看妳流汗的樣子好帥！<br>${T.p.walk && !day.walkDone ? '記得再去走走路，今天的運動就全部完成囉。':'今天的運動完成 ✓'}`); }, 600);
}

/* ========== 行事曆提醒 ========== */
function makeICS(){
  const on = reminders().filter(r=>r.on);
  if(!on.length){ toast('先勾選至少一個提醒'); return; }
  const d = new Date(), ymd = d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const stamp = d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const url = location.href.split('#')[0].split('?')[0];
  const ev = on.map(r=>{ const [h,mi]=r.t.split(':'); return [
    'BEGIN:VEVENT', `UID:qingqing-${r.id}-${ymd}@qingqing-diary`, `DTSTAMP:${stamp}`,
    `DTSTART:${ymd}T${h}${mi}00`, 'DURATION:PT5M', 'RRULE:FREQ=DAILY',
    `SUMMARY:${r.title}`, `DESCRIPTION:${r.body}\\n${url}`, `URL:${url}`,
    'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M',`DESCRIPTION:${r.title}`,'END:VALARM','END:VEVENT'].join('\r\n'); });
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//qingqing-diary//ZH-TW','CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '輕輕日記提醒.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  toast(`已產生 ${on.length} 個每日提醒 📅`);
}

let toastT;
function toast(t){ const old=$('.toast'); if(old) old.remove(); const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(),2200); }
function confetti(set){

// 自動更新：打開或回到 App 時，偷偷問伺服器有沒有新版，有就換上
const APP_VERSION = '20261127-2';
async function checkUpdate(){
  try{
    const r = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if(m && m[1] !== APP_VERSION && sessionStorage.getItem('qq-upd') !== m[1]){
      sessionStorage.setItem('qq-upd', m[1]);   // 避免一直重新整理
      location.replace(location.pathname + '?v=' + m[1]);

  }catch(_){}

    const day = data.days?.[key];
    if(!day || JSON.stringify(day) !== JSON.stringify(expected)) throw new Error('紀錄已有更新，請重新整理後再修改。');
    if(changes===null){
      data.days[key] = {water:0, habits:{}, u:stamp, del:true};
      return;
    }
    const {w, water, mood, note} = changes;
    if(!(w===null || (Number.isFinite(w) && w>25 && w<300)) ||
      !Number.isInteger(water) || water<0 || water>30 ||
      typeof note!=='string' || (mood!==null && !MOODS.includes(mood))) throw new Error('請確認日記欄位。');
    const next = {...day, water, mood, note, u:stamp};
    if(w===null) delete next.w; else next.w = r1(w);
    if(w===null || water<WATER_GOAL) next.perfect = false;
    data.days[key] = next;
    return;
  }
  const group = kind==='event' ? 'events' : 'ledger';
  const index = data[group]?.findIndex(entry=>entry.id===key) ?? -1;
  const original = data[group]?.[index];
  if(!original || original.del || JSON.stringify(original) !== JSON.stringify(expected)){
    throw new Error('紀錄已有更新，請重新整理後再修改。');
  }
  if(changes===null){
    data[group][index] = {...original, del:true, u:stamp};
    return;
  }
  if(!validSpokenDiaryDate(changes.date)) throw new Error('請確認記錄日期。');
  if(kind==='event'){
    const {title, date, time, rep} = changes;
    if(typeof title!=='string' || !title.trim() || title.length>60 ||
      (time!=='' && !/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) || !Object.keys(REP).includes(rep)){
      throw new Error('請確認提醒事項、時間和重複方式。');
    }
    data[group][index] = {...original, title, date, time, rep, u:stamp};
    return;
  }
  const {type, amt, cat, date, note} = changes;
  if(!(Number.isFinite(amt) && amt>0 && amt<=1e8) || typeof note!=='string' || note.length>40 ||
    !Array.isArray(CATS[type]) || !CATS[type].some(([label])=>label===cat)) throw new Error('請確認記帳金額和分類。');
  data[group][index] = {...original, type, amt, cat, date, note, u:stamp};
}

const Cloud = {
  user:null, watcher:false, busy:false, lastSync:null, error:'', access:null, accessError:'',
  async loadManager(){
    if(!Cloud.watcher) return;
    const call = ++managerLoad, generation = session;
    const current = ()=>session===generation && managerLoad===call && Cloud.watcher;
    QQ.setManager({loading:true});
    try{
      const grants = await getDocsFromServer(query(collection(db, ACCESS_COLLECTION), where('manage','==',true)));
      const result = await Promise.allSettled(grants.docs.map(async grant=>{
        const id = grant.id;
        const [diary, records, voice] = await Promise.all([
          getDocFromServer(rootRef(id)),
          getDocFromServer(privateRef(id)),
          grant.data().shareSpoken ? getDocFromServer(privateRef(id,'voiceShare')).catch(error=>{
            if(error.code!=='permission-denied') throw error;
            return null;
          }) : null,
        ]);
        const data = mergeOwnerSnapshot(diary, records);
        return data.profile ? {id, updatedAt:envelopeStamp(diary), data, voice:voice ? readData(voice) : null} : null;
      }));
      if(!current()) return;
      managerRows = result.flatMap(item=>item.status==='fulfilled' && item.value ? [item.value] : []);
      managerRows.sort((a,b)=>b.updatedAt-a.updatedAt);
      const failure = result.find(item=>item.status==='rejected' && item.reason.code!=='permission-denied');
      QQ.setManager({list:managerRows, error:!managerRows.length && failure ? errText(failure.reason) : ''});
    }catch(error){
      if(current()){ managerRows=[]; QQ.setManager({error:errText(error)}); }
    }
  },
  async manage(owner, kind, key, changes, original){
    if(!Cloud.watcher || !['day','event','ledger'].includes(kind)) throw new Error('無法變更這筆紀錄。');
    const generation = session;
    const row = managerRows.find(item=>item.id===owner);
    if(!row) throw new Error('請重新整理授權紀錄。');
    const expected = original || (kind==='day' ? row.data.days?.[key] :
      (kind==='event' ? row.data.events : row.data.ledger).find(entry=>entry.id===key));
    const target = kind==='day' ? rootRef(owner) : privateRef(owner);
    await runTransaction(db, async tx=>{
      const snap = await tx.get(target);
      if(session!==generation || !Cloud.watcher || !snap.exists()) throw new Error('授權紀錄已變更。');
      const data = readData(snap);
      const updatedAt = stampAfter(envelopeStamp(snap), expected?.u);
      editManagedData(data,kind,key,changes,updatedAt,expected);
      tx.update(target,{data:JSON.stringify(data),updatedAt});
    });
  },
  canShareOnThisDevice(){
    return !!(Cloud.user && Cloud.access?.shareSpoken && deviceId()===Cloud.access.shareDevice);
  },
  async setAccess(manage, shareSpoken){
    const user=Cloud.user, generation=session;
    if(!user || Cloud.watcher) throw new Error('請用日記本人的帳號登入。');
    ++accessRevision;
    if(shareSpoken && !deviceId()) localStorage.setItem(VOICE_DEVICE_KEY, crypto.randomUUID());
    const access = {manage, shareSpoken, shareDevice:shareSpoken?deviceId():''};
    const grant = grantRef(user.uid), voice = privateRef(user.uid,'voiceShare');
    await runTransaction(db, async tx=>{
      await tx.get(grant);
      if(generation!==session) throw new Error('帳號已變更。');
      tx.set(grant, access);
      if(shareSpoken) tx.set(voice, voicePayload(QQ.spokenRecords(),access.shareDevice));
      else tx.delete(voice);
    });
    if(generation!==session) return false;
    ++accessRevision;
    Cloud.access=access; Cloud.accessError=''; QQ.refresh();
    if(shareSpoken) Cloud.publishSharedVoice();
    return true;
  },
  async publishSharedVoice(){
    const user=Cloud.user, generation=session;
    if(!user || Cloud.watcher || !Cloud.canShareOnThisDevice()) return;
    try{
      const grant = grantRef(user.uid), voice = privateRef(user.uid,'voiceShare');
      const device=deviceId();
      await runTransaction(db, async tx=>{
        const access = (await tx.get(grant)).data();
        if(generation!==session || !access?.manage || !access.shareSpoken || access.shareDevice!==device) return;
        const snapshot = await tx.get(voice);
        if(generation!==session) return;
        const value = voicePayload(QQ.spokenRecords(),device);
        if(value.data!==snapshot.data()?.data) tx.set(voice,value);
      });
    }catch(error){ if(generation===session){ Cloud.error=errText(error); QQ.refresh(); } }
  },
  async login(){
    Cloud.error='';
    try{ await signInWithPopup(auth,provider); }
    catch(error){
      if(['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(error.code)) return;
      if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(error.code)){
        return signInWithRedirect(auth,provider);
      }
      Cloud.error=errText(error); QQ.refresh();
    }
  },
  async wipe(){
    const user=Cloud.user;
    if(!user || Cloud.watcher) return;
    const generation=++session;
    clearTimeout(pushTimer); clearTimeout(voiceTimer); syncAgain=false;
    Cloud.busy=true; QQ.refresh();
    try{
      await runTransaction(db, async tx=>{
        const target = rootRef(user.uid);
        const main = privateRef(user.uid);
        const grant = grantRef(user.uid);
        await Promise.all([tx.get(target),tx.get(main),tx.get(grant)]);
        if(session!==generation) throw new Error('帳號已變更。');
        const updatedAt=Date.now();
        tx.set(target,{data:'{}',updatedAt,email:user.email||''});
        tx.set(main,{data:'{}',updatedAt});
        tx.set(grant,emptyAccess());
        tx.delete(privateRef(user.uid,'voiceShare'));
      });
      if(session===generation){ Cloud.access=emptyAccess(); Cloud.accessError=''; Cloud.error=''; }
    }catch(error){ if(session===generation) Cloud.error=errText(error); }
    finally{
      if(session===generation){ Cloud.busy=false; QQ.refresh(); if(syncAgain) Cloud.sync(); }
    }
  },
  async logout(){ await signOut(auth); },
  async sync(){
    const user=Cloud.user;
    if(!user) return;
    if(Cloud.watcher) return Cloud.loadManager();
    if(Cloud.busy){ syncAgain=true; return; }
    const generation=session;
    const local=JSON.parse(JSON.stringify(QQ.get()));
    Cloud.busy=true; Cloud.error=''; syncAgain=false; QQ.refresh();
    try{
      const accessVersion=accessRevision;
      const accessRequest=getDocFromServer(grantRef(user.uid)).then(snap=>{
        if(session===generation && accessVersion===accessRevision){ Cloud.access=snap.data()||emptyAccess(); Cloud.accessError=''; QQ.refresh(); }
      }).catch(error=>{
        if(session===generation && accessVersion===accessRevision){ Cloud.access=null; Cloud.accessError=errText(error); QQ.refresh(); }
      });
      const committed=await runTransaction(db, async tx=>{
        const [diary,records]=await Promise.all([tx.get(rootRef(user.uid)),tx.get(privateRef(user.uid))]);
        if(session!==generation) throw new Error('帳號已變更。');
        const merged=QQ.merge(local,mergeOwnerSnapshot(diary,records));
        if(merged?.profile) writeOwnerSnapshot(tx,diary,records,merged,user);
        return merged;
      });
      if(session!==generation) return;
      const latest=QQ.get();
      if(committed?.profile) QQ.replace(latest.updatedAt===local.updatedAt ? committed : QQ.merge(latest,committed));
      await accessRequest;
      if(session===generation){
        Cloud.lastSync=new Date();
        Cloud.publishSharedVoice();
      }
    }catch(error){ if(session===generation) Cloud.error=errText(error); }
    finally{
      if(session===generation){
        Cloud.busy=false; QQ.refresh();
        if(syncAgain) Cloud.sync();
      }
    }
  },
};
window.Cloud=Cloud;

window.addEventListener('qq-saved',()=>{
  if(!Cloud.user || Cloud.watcher) return;
  clearTimeout(pushTimer); pushTimer=setTimeout(()=>Cloud.sync(),1500);
});
window.addEventListener('qq-spoken-saved',()=>{
  if(!Cloud.user || Cloud.watcher) return;
  clearTimeout(voiceTimer); voiceTimer=setTimeout(()=>Cloud.publishSharedVoice(),400);
});

getRedirectResult(auth).catch(error=>{ Cloud.error=errText(error); QQ.refresh(); });
onAuthStateChanged(auth, user=>{
  const wasManager=Cloud.watcher;
  ++session; ++managerLoad; syncAgain=false; managerRows=[];
  clearTimeout(pushTimer); clearTimeout(voiceTimer);
  Cloud.user=user; Cloud.watcher=isManager(user); Cloud.busy=false;
  Cloud.access=null; Cloud.accessError=''; Cloud.lastSync=null;
  if(wasManager || Cloud.watcher) QQ.setManager(null); else QQ.refresh();
  if(user) Cloud.sync();
});
QQ.refresh();
</script>
