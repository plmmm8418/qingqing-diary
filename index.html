<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="輕輕日記">
<meta name="theme-color" content="#fff3ec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>輕輕日記</title>
<style>
:root{
  --bg:#fff7f2; --card:#ffffff; --ink:#4a3b36; --soft:#9a8580; --line:#f1e4dd;
  --peach:#ffb59a; --peach-d:#f28c6a; --mint:#9fe0c8; --mint-d:#4fbf98;
  --sky:#a9d8ff; --sky-d:#4fa3e8; --sun:#ffd86b; --pink:#ffc8d8;
  --r:22px; --shadow:0 6px 20px rgba(160,100,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));padding-top:calc(16px + env(safe-area-inset-top))}
@media(min-width:760px){
  body{background:linear-gradient(135deg,#ffeee5,#eef9f4)}
  .app{background:var(--bg);min-height:100vh;box-shadow:0 0 40px rgba(160,100,80,.12)}
}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}
.hello{font-size:22px;font-weight:800}
.date{font-size:13px;color:var(--soft);margin-top:2px}
.streak{background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;box-shadow:var(--shadow);font-size:15px;white-space:nowrap}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:500;color:var(--soft);font-size:12px}
.muted{color:var(--soft);font-size:13px}

/* pet */
.petcard{background:linear-gradient(180deg,#fff0e8 0%,#ffffff 85%);text-align:center;position:relative;overflow:hidden}
.petcard.rainbow{background:linear-gradient(180deg,#ffe3ec 0%,#fff4d6 30%,#e3f7ee 60%,#ffffff 90%)}
.stage{position:relative;width:180px;height:170px;margin:6px auto 0}
.pet{width:180px;height:170px;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.pet.jump{animation:jump .6s ease}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(1.02,.98)}}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-28px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.acc{position:absolute;font-size:34px;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08))}
.acc.head{left:50%;top:6px;font-size:44px;transform:translateX(-50%) rotate(-8deg)}
.acc.face{left:50%;top:66px;transform:translateX(-50%);font-size:40px}
.acc.neck{left:50%;top:112px;transform:translateX(-50%);font-size:30px}
.acc.hand{right:2px;top:70px;font-size:32px;animation:sway 3s ease-in-out infinite}
.acc.side{left:4px;top:30px;font-size:26px;animation:flutter 2.2s ease-in-out infinite}
.acc.aura{left:8px;top:110px;font-size:22px;animation:twinkle 1.8s ease-in-out infinite}
.acc.aura2{right:14px;top:6px;font-size:20px;animation:twinkle 2.3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes flutter{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-8px)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.bubble{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 14px;font-size:14px;margin:2px 10px 8px;max-width:90%;position:relative}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.away{font-size:15px;padding:30px 0 12px}
.ringrow{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:8px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--peach)}

/* weight input */
.wrow{display:flex;align-items:center;gap:10px;justify-content:center}
.step{width:48px;height:48px;border-radius:50%;background:#fff3ec;font-size:24px;font-weight:800;color:var(--peach-d)}
.step:active{transform:scale(.92)}
.wnum{width:120px;text-align:center;font-size:34px;font-weight:800;border:0;border-bottom:3px solid var(--line);background:transparent;padding:4px 0;outline:none}
.wunit{font-size:15px;color:var(--soft)}
.btn{display:block;width:100%;padding:13px;border-radius:16px;background:var(--peach-d);color:#fff;font-weight:800;font-size:16px;margin-top:12px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff3ec;color:var(--peach-d)}
.btn.mint{background:var(--mint-d)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin-top:0}
.done-line{display:flex;justify-content:space-between;align-items:center;background:#effaf5;border-radius:14px;padding:12px 14px}
.done-line b{font-size:22px}

/* water */
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cup{aspect-ratio:3/4;border-radius:8px 8px 12px 12px;border:2px solid #cfe8ff;background:#fff;position:relative;overflow:hidden}
.cup:after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#bfe3ff,#7cc2f5);transition:height .35s}
.cup.on:after{height:78%}
.cup:active{transform:scale(.9)}

/* habits */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.habit{display:flex;align-items:center;gap:8px;padding:12px;border-radius:16px;background:#faf5f2;text-align:left;font-size:14px;line-height:1.3;border:2px solid transparent;transition:.2s}
.habit .e{font-size:24px}
.habit.on{background:#effaf5;border-color:var(--mint)}
.habit.on .t:after{content:" ✓";color:var(--mint-d);font-weight:800}
.habit:active{transform:scale(.96)}

/* mood */
.moods{display:flex;justify-content:space-between}
.mood{font-size:30px;width:52px;height:52px;border-radius:50%;opacity:.45;transition:.2s}
.mood.on{opacity:1;background:#fff3ec;transform:scale(1.1)}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;resize:none;background:#fffdfb;outline:none}

/* weight tab */
.big{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:6px}
.big b{display:block;font-size:24px}
.big span{font-size:12px;color:var(--soft)}
.road{position:relative;height:16px;background:var(--line);border-radius:999px;margin:20px 6px 26px}
.road .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--peach),var(--peach-d));border-radius:999px;transition:width .6s}
.road .ms{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center}
.road .ms.on{border-color:var(--peach-d)}
.road .me{position:absolute;top:-30px;font-size:22px;transform:translateX(-50%);transition:left .6s}
.seg{display:flex;background:#faf5f2;border-radius:12px;padding:3px}
.seg button{padding:5px 10px;border-radius:10px;font-size:12px;color:var(--soft)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.06)}
svg.chart{width:100%;height:auto;display:block}
.tip{background:#fff8e1;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:10px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border:0}
.del{color:#c9b3ab;font-size:13px;padding:4px 8px}

/* collection */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.item{aspect-ratio:1;border-radius:16px;background:#faf5f2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px}
.item small{font-size:10px;color:var(--soft);margin-top:2px}
.item.lock{filter:grayscale(1);opacity:.4}
.post{background:#fffaf0;border:2px dashed #f3d9b1;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.6}
.post .d{font-size:11px;color:var(--soft)}

/* forms */
label.f{display:block;margin-bottom:12px;font-size:14px;font-weight:700}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fffdfb;font-weight:500;outline:none}
label.f input:focus,label.f textarea:focus{border-color:var(--peach)}
.warn{background:#fff0f0;color:#b5543c;border-radius:12px;padding:10px 12px;font-size:13px;margin:-4px 0 12px;line-height:1.5}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs .in{max-width:480px;margin:0 auto;display:flex}
.tabs button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:22px;filter:grayscale(1);opacity:.6}
.tabs button.on{color:var(--peach-d);font-weight:800}
.tabs button.on span{filter:none;opacity:1}

/* modal & toast */
.mask{position:fixed;inset:0;background:rgba(74,59,54,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;animation:fade .2s}
.modal{background:#fff;border-radius:26px;padding:24px 20px 18px;max-width:360px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.modal .em{font-size:64px;line-height:1.1}
.modal h2{margin:8px 0 6px;font-size:20px}
.modal p{margin:0 0 6px;line-height:1.7;font-size:15px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;animation:fade .2s;white-space:nowrap}
.confetti{position:fixed;top:-40px;font-size:24px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* nudge */
.nudge{background:linear-gradient(90deg,#fff4d6,#ffe9e0);border-radius:16px;padding:11px 14px;margin-bottom:14px;font-size:14px;line-height:1.5;box-shadow:var(--shadow)}
/* meals */
.meal{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-of-type{border-bottom:0}
.meal .me{font-size:24px;width:30px;text-align:center}
.meal .mt{flex:1;font-size:14px;line-height:1.45}
.meal .mt b{display:block;font-size:12px;color:var(--soft);font-weight:700}
.meal .mt small{color:var(--soft)}
.meal.eaten .mt{opacity:.55}
.mini{min-width:38px;height:34px;border-radius:12px;background:#faf5f2;font-size:13px;font-weight:700;color:var(--soft);padding:0 8px}
.mini.on{background:var(--mint-d);color:#fff}
/* workout */
.wk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#faf5f2;margin-bottom:8px}
.wk.on{background:#effaf5}
.wk .e{font-size:26px}
.wk .tx{flex:1;font-size:14px;line-height:1.45}
.wk .tx small{color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips span{background:#fff;border-radius:999px;padding:3px 9px;font-size:12px}
.timer .em{font-size:80px}
.count{font-size:64px;font-weight:900;color:var(--peach-d);line-height:1;margin:6px 0}
.count.rest{color:var(--mint-d)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--peach);transition:width .9s linear}
.row2{display:flex;gap:8px}.row2 .btn{margin-top:8px}
/* reminders */
.rm{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rm:last-of-type{border-bottom:0}
.rm span{flex:1}
.rm input[type=time]{border:2px solid var(--line);border-radius:10px;padding:5px 6px;background:#fffdfb}
.rm input[type=checkbox]{width:20px;height:20px;accent-color:var(--peach-d)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:16px;background:#fff;border:2px solid #e3dcd8;font-weight:700;font-size:15px}
.gbtn:active{transform:scale(.98)}
.gbtn[disabled]{opacity:.5}
.acct{display:flex;align-items:center;gap:12px}
.acct img,.acct span{width:44px;height:44px;border-radius:50%;background:#faf5f2;display:flex;align-items:center;justify-content:center;font-size:22px}
.logintip{background:linear-gradient(135deg,#eaf4ff,#fff3ec);border:2px solid #d6e8fb;border-radius:var(--r);padding:16px;margin-bottom:14px;text-align:center;box-shadow:var(--shadow)}
.logintip .lt-t{font-weight:800;font-size:16px}
.logintip .later{margin-top:8px;font-size:13px;color:var(--soft);padding:6px 10px}
.vids{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.wrowx{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed #f1dfe4;font-size:13px;flex-wrap:wrap}.wrowx b{width:42px}
.wstat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.wstat small{display:block;color:#a58b93;font-size:11px}.wstat b{font-size:18px}
.pbar{height:10px;border-radius:9px;background:#f6e6ea;overflow:hidden;margin-top:10px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9fb5,#ffc58f)}
.vids .vh{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.vid{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:16px;background:#faf5f2;margin-bottom:8px}
.vid.on{background:#effaf5}
.vthumb{position:relative;width:132px;flex:none;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#eee}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.vthumb em{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-size:11px;padding:1px 5px;border-radius:6px}
.vtx{flex:1;min-width:0;font-size:13px;line-height:1.4;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.vtx b{font-size:13px}
.vtx small{color:var(--soft);font-size:11px}
.vtx .mini{margin-top:4px;height:28px;font-size:12px}
.vmodal{max-width:560px;padding:12px 12px 14px}
.vframe{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs hide" id="tabs"><div class="in">
  <button data-tab="today" class="on"><span>🌤️</span>今天</button>
  <button data-tab="weight"><span>📉</span>體重</button>
  <button data-tab="collect"><span>🎁</span>收藏</button>
  <button data-tab="settings"><span>⚙️</span>設定</button>
</div></nav>

<script>
/* ========== 資料 ========== */
const KEY = 'qingqing-diary-v1';
const HABITS = [
  {id:'veg',  e:'🥗', t:'每餐半盤蔬菜'},
  {id:'walk', e:'🏃‍♀️', t:'完成今日運動'},
  {id:'night',e:'🌙', t:'晚上 8 點後不吃'},
  {id:'sleep',e:'😴', t:'12 點前睡覺'},
];
const WATER_GOAL = 8;
const OUTING_AT = 4; // 完成幾項，夥伴就出門散步
const MOODS = ['😫','😕','🙂','😊','🥰'];
const REWARDS = [ // 每減 1 公斤解鎖一個
  {kg:1, e:'🌸', n:'小花',   slot:'hand'},
  {kg:2, e:'🎀', n:'蝴蝶結', slot:'head'},
  {kg:3, e:'🧣', n:'小圍巾', slot:'neck'},
  {kg:4, e:'🕶️', n:'墨鏡',   slot:'face'},
  {kg:5, e:'👒', n:'草帽',   slot:'head'},
  {kg:6, e:'🎈', n:'氣球',   slot:'hand'},
  {kg:7, e:'🦋', n:'蝴蝶',   slot:'side'},
  {kg:8, e:'✨', n:'閃閃',   slot:'aura'},
  {kg:9, e:'🌈', n:'彩虹',   slot:'bg'},
  {kg:10,e:'👑', n:'皇冠',   slot:'head'},
];
const POSTCARDS = [
  '我去芹壁的石頭屋晃了一圈，帶回一顆圓圓的小石頭，跟妳一樣可愛。',
  '北竿的風好大，差點把我吹走！還好今天妳有好好喝水，我也很有力氣。',
  '我在海邊看到藍眼淚的預告，說今晚會很美，就像今天認真的妳。',
  '路過老酒工廠，聞到好香的味道……但我忍住了！跟妳學的 😤',
  '今天走了好多路，我數了一下，大概有一百萬步（騙妳的，但我很努力）。',
  '我在路邊撿到一片心形葉子，送給今天也沒放棄的妳。',
  '小提醒：體重會上上下下，就像海浪。看趨勢，不看一天。',
  '我遇到一隻貓，牠說妳今天的打卡很漂亮。',
  '今天的夕陽是橘子色的，我幫妳看了，也幫妳許了願。',
  '偷偷告訴妳：慢慢瘦的人，最不容易復胖。',
  '我在步道上看到一朵小黃花，它沒有很大，但開得很認真。',
  '今天在港口看船，風把我的臉吹得圓圓的（本來就圓）。',
  '我想了一下，妳最厲害的地方不是瘦了多少，是每天都回來。',
  '帶回一杯想像中的熱茶，給妳暖暖手。',
  '今天的雲像一顆饅頭。嗯……沒關係，我們看看就好。',
  '我去爬了小山坡，喘到不行，終於知道妳走路有多棒。',
  '在沙灘寫了妳的名字，浪來之前我先拍照存起來了。',
  '今天有點累也沒關係，休息也是計畫的一部分。',
  '我幫妳跟月亮說了晚安，記得 12 點前睡喔。',
  '撿到一枚貝殼，裡面好像有海的聲音，說：「妳很棒」。',
];
const PET_LINES = {
  sleepy: ['早安～我還有點睏，陪我喝杯水好嗎？','今天也一起慢慢來 ☁️','先量個體重，我幫妳記著！'],
  mid:    ['再一點點，我就能出門散步了！','妳做得很好，繼續保持 ✨','喝水水～咕嚕咕嚕 💧'],
  happy:  ['今天超棒！我好開心 🥰','妳是我見過最有毅力的人！','耶～今天的任務都完成啦！'],
  tap:    ['嘿嘿，好癢 😆','戳我也不會變瘦啦～（但我很開心）','妳今天看起來很有精神！','要不要起來伸個懶腰？','我們一起加油！💪','別忘了喝水喔～'],
};

/* ---------- 飲食計畫（台灣好買、外食也做得到）---------- */
const MEALS = [

  const p = S.profile; const w = stats().cur || p.start;
  const h = p.height || 160, age = p.age || 40;
  const bmr = 10*w + 6.25*h - 5*age - 161;      // Mifflin-St Jeor（女性）

}

function workoutPlan(k=dkey()){
  const start = parseKey(S.profile.startDate || dkey());
  const week = Math.max(1, Math.floor((parseKey(k) - start)/864e5/7) + 1);
  const ph = week<=2 ? 0 : week<=4 ? 1 : 2;
  const dow = parseKey(k).getDay();
  if(dow === 0) return {week, title:'休息日・輕鬆伸展', walk:0, moves:['reach','fold','catcow'], rounds:2, work:40, rest:10};
  const strength = [2,4,6].includes(dow);
  return {
    week, walk:[20,30,40][ph],
    title: strength ? '走路＋居家肌力' : '走路日',
    moves: strength ? (ph<2 ? ['squat','wallpush','bridge','march'] : ['squat','lunge','wallpush','bridge','plank']) : [],
    rounds:[2,3,3][ph], work:[30,40,45][ph], rest:[20,20,15][ph],
  };
}
function syncWorkout(day){
  const p = workoutPlan();
  const done = (!p.walk || day.walkDone) && (!p.moves.length || day.trainDone);
  day.habits.walk = done;
}

// 兩邊的資料合併：以比較新的為主，另一邊多出來的日子、明信片也保留
function mergeData(a, b){
  if(!a || !a.profile) return b; if(!b || !b.profile) return a;
  const [n, o] = (a.updatedAt||0) >= (b.updatedAt||0) ? [a, b] : [b, a];
  const m = JSON.parse(JSON.stringify(n));
  m.days = m.days || {};
  for(const k in (o.days||{})) if(!m.days[k]) m.days[k] = o.days[k];
  m.postcards = m.postcards || [];
  const seen = new Set(m.postcards.map(c=>c.d+c.t));
  (o.postcards||[]).forEach(c=>{ if(!seen.has(c.d+c.t)) m.postcards.push(c); });
  m.postcards.sort((x,y)=> x.d < y.d ? -1 : x.d > y.d ? 1 : 0);
  m.unlocked = Math.max(n.unlocked||0, o.unlocked||0);
  m.updatedAt = Math.max(n.updatedAt||0, o.updatedAt||0);
  return m;
}

function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const r1 = n => Math.round(n*10)/10;
const fmt = n => (Math.round(n*10)/10).toFixed(1);
function today(){ const k=dkey(); if(!S.days[k]) S.days[k]={water:0,habits:{}}; return S.days[k]; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function dateLabel(k){ const d=parseKey(k); return (d.getMonth()+1)+'/'+d.getDate(); }

/* ========== 計算 ========== */
function doneCount(day){
  if(!day) return 0;
  let n = 0;
  if(day.w) n++;
  if((day.water||0) >= WATER_GOAL) n++;
  HABITS.forEach(h=>{ if(day.habits && day.habits[h.id]) n++; });
  return n;
}
const TOTAL = 2 + HABITS.length;
function active(day){ return day && (day.w || day.water || day.mood || Object.values(day.habits||{}).some(Boolean)); }

// 連續天數：每 7 天可以有 1 天「請假」不中斷（寬容，不給壓力）
function streak(){
  const keys = Object.keys(S.days).filter(k=>active(S.days[k])).sort();
  if(!keys.length) return {n:0, rest:false};
  const first = parseKey(keys[0]);
  let d = new Date(); d.setHours(0,0,0,0);
  if(!active(S.days[dkey(d)])) d = addDays(d,-1);
  let n=0, lastSkip=null, k=0, usedRest=false;
  while(d >= first){
    if(active(S.days[dkey(d)])) n++;
    else if(lastSkip===null || k-lastSkip>=7){ lastSkip=k; usedRest=true; }
    else break;
    d = addDays(d,-1); k++;
  }
  return {n, rest:usedRest};
}

// 趨勢體重（指數平滑）：把每天的上下起伏抹平，看真正的方向
function weights(){
  return Object.keys(S.days).filter(k=>S.days[k].w).sort().map(k=>({k, w:S.days[k].w}));
}
function trendSeries(){
  const ws = weights(); let t=null;
  return ws.map(p=>{ t = t===null ? p.w : t + 0.2*(p.w - t); return {...p, t}; });
}
function stats(){
  const p = S.profile, ts = trendSeries();
  const cur = ts.length ? ts[ts.length-1].t : p.start;
  const last = ts.length ? ts[ts.length-1].w : p.start;
  const lost = Math.max(0, p.start - cur);
  const goalLoss = p.start - p.goal;
  const remain = Math.max(0, cur - p.goal);
  // 最近 14 天的每週速度
  let rate = null;
  if(ts.length >= 3){
    const lastD = parseKey(ts[ts.length-1].k);
    const ref = ts.slice().reverse().find(x => (lastD - parseKey(x.k))/864e5 >= 7) || ts[0];
    const days = (lastD - parseKey(ref.k))/864e5;
    if(days >= 4) rate = (ref.t - cur) / days * 7;
  }
  return {cur, last, lost, goalLoss, remain, rate, ts};
}
function checkUnlock(){
  const {lost} = stats();
  const kg = Math.min(10, Math.floor(lost + 1e-9));
  if(kg > (S.unlocked||0)){
    S.unlocked = kg; save(); render();
    const r = REWARDS[kg-1];
    setTimeout(()=>{
      confetti(kg===10 ? ['👑','🎉','💖','✨'] : [r.e,'🎉','✨']);
      modal(r.e, kg===10 ? '目標達成！！' : `減掉 ${kg} 公斤！`,
        kg===10 ? `${esc(S.profile.name)}，妳做到了！<br>${esc(S.profile.pet)}戴上皇冠，正式封妳為女王 👑`
                : `${esc(S.profile.pet)}得到新禮物：<b>${r.e} ${r.n}</b><br>${kg===5?'已經走完一半了，超級厲害！':'一步一步，好棒！'}`);
    }, 400);
  }
}

  return {html:h, rainbow:!!slots.bg};
}

    ${hist.length ? `<ul class="hist">${hist.map(x=>`<li><span>${x.k.replace(/-/g,'/')}</span><b>${fmt(x.w)} kg</b><button class="del" data-act="delw" data-k="${x.k}">刪除</button></li>`).join('')}</ul>` : '<div class="muted">還沒有紀錄，到「今天」量第一次吧！</div>'}
    <button class="btn ghost" data-act="addpast">＋ 補記之前的體重</button>

function chart(ts){
  if(ts.length < 2) return '<div class="muted" style="padding:30px 0;text-align:center">記錄兩天以上就會出現曲線 ✏️</div>';
  let pts = ts;
  if(chartRange){ const from = addDays(new Date(), -chartRange); pts = ts.filter(x=>parseKey(x.k) >= from); if(pts.length<2) pts = ts.slice(-2); }
  const W=340,H=180,L=34,R=10,T=12,B=24;
  const t0 = parseKey(pts[0].k), t1 = parseKey(pts[pts.length-1].k);
  const span = Math.max(1,(t1-t0)/864e5);
  let vals = pts.flatMap(x=>[x.w,x.t]); let lo=Math.min(...vals), hi=Math.max(...vals);
  const goal = S.profile.goal; const showGoal = goal >= lo-1.5;
  if(showGoal) lo = Math.min(lo, goal);
  lo = Math.floor(lo-0.5); hi = Math.ceil(hi+0.5);
  const x = k => L + ((parseKey(k)-t0)/864e5)/span*(W-L-R);
  const y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  const step = Math.max(1, Math.ceil((hi-lo)/4));
  let grid=''; for(let v=hi; v>=lo; v-=step){ grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#f1e4dd"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#9a8580">${v}</text>`; }
  const line = pts.map((p,i)=>(i?'L':'M')+x(p.k).toFixed(1)+' '+y(p.t).toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${x(p.k)}" cy="${y(p.w)}" r="3" fill="#ffcfb8"/>`).join('');
  const g = showGoal ? `<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#4fbf98" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(goal)-4}" font-size="10" text-anchor="end" fill="#4fbf98">目標 ${fmt(goal)}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${g}${dots}
    <path d="${line}" fill="none" stroke="#f28c6a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="#9a8580">${dateLabel(pts[0].k)}</text>
    <text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" fill="#9a8580">${dateLabel(pts[pts.length-1].k)}</text></svg>`;
}

function readProfile(){
  const v = id => $('#'+id).value.trim();
  const p = {...(S.profile||{}), name:v('pName')||'闆娘', pet:v('pPet')||'圓圓',
    height:parseFloat(v('pH'))||0, age:parseInt(v('pAge'))||0, start:parseFloat(v('pStart')), goal:parseFloat(v('pGoal'))};
  if(!(p.start>25 && p.start<300)){ return {err:'請填開始體重（公斤）'}; }
  if(!(p.goal>20 && p.goal<p.start)){ return {err:'目標體重要比開始體重輕喔'}; }
  if(p.height>100){
    const m = p.height/100, bmi = p.goal/(m*m), minW = r1(18.5*m*m);
    if(bmi < 18.5) return {err:`這個目標 BMI 只有 ${bmi.toFixed(1)}，低於健康範圍。建議目標不要低於 ${fmt(minW)} kg。`};
  }
  return {p};
}

/* ========== 互動 ========== */
function afterProgress(){
  save();
  const day = today();
  if(!day.outing && doneCount(day) >= OUTING_AT){
    day.outing = true;
    const cheer = (S.profile.cheer||[]).filter(Boolean);
    const seen = new Set((S.postcards||[]).map(c=>c.t));
    let pool = POSTCARDS.filter(t=>!seen.has(t));
    if(!pool.length) pool = POSTCARDS;
    let text = pick(pool), from = S.profile.pet;
    if(cheer.length && Math.random() < 0.4){ text = '💌 老大託我帶話：「' + pick(cheer) + '」'; }
    S.postcards = S.postcards||[]; S.postcards.push({d:dkey(), t:text});
    save();
    setTimeout(()=>{ confetti(['💌','🌸','✨']); modal('💌', `${esc(from)}散步回來了！`, `帶回一張明信片：<br><br>${esc(text)}`); }, 350);
  }
  if(doneCount(day) === TOTAL && !day.perfect){
    day.perfect = true; save();
    setTimeout(()=>{ confetti(['🎉','⭐','💖']); toast('今天全部完成！妳太強了 🎉'); }, day.outing?1200:300);
  }
  petLine = null;
  render();
}
document.addEventListener('click', e=>{
  const tb = e.target.closest('[data-tab]');
  if(tb){ tab = tb.dataset.tab; petLine=null; render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, day = S.profile ? today() : null;
  switch(act){
    case 'start': {

      S.days[dkey()] = {water:0, habits:{}, w:r.p.start};
      save(); tab='today'; render();
      setTimeout(()=>modal('🐣', `嗨，我是${esc(S.profile.pet)}！`, `從今天開始陪妳一起變輕盈。<br>每天點一點就好，不用勉強。<br>每輕 1 公斤，我就會收到一個禮物喔 🎁`), 200);
      break; }
    case 'pet': {
      petLine = pick(PET_LINES.tap); $('#bubble').textContent = petLine;

    case 'wm': case 'wp': {

    case 'savew': {
      const v = parseFloat($('#wIn').value);
      if(!(v>25 && v<300)){ toast('體重好像怪怪的，再確認一下'); return; }
      day.w = r1(v); afterProgress(); checkUnlock(); toast('記好了！' + (S.profile.pet) + '幫妳收著 ✓'); break; }
    case 'editw': { delete day.w; day.perfect = false; save(); render(); break; }
    case 'cup': {
      const i = +el.dataset.i; day.water = (i+1 === day.water) ? i : i+1;
      if(day.water === WATER_GOAL) toast('喝滿 8 杯了，水水的 💧');
      afterProgress(); break; }
    case 'habit': { day.habits[el.dataset.id] = !day.habits[el.dataset.id]; if(!day.habits[el.dataset.id]) day.perfect=false; afterProgress(); break; }
    case 'mood': { day.mood = day.mood===el.dataset.m ? null : el.dataset.m; save(); render(); break; }
    case 'range': { chartRange = +el.dataset.r; render(); break; }
    case 'delw': {
      if(confirm(`刪除 ${el.dataset.k} 的體重紀錄？`)){ delete S.days[el.dataset.k].w; save(); render(); } break; }
    case 'addpast': pastForm(); break;
    case 'savepast': {
      const k = $('#pastD').value, v = parseFloat($('#pastW').value);
      if(!k || !(v>25 && v<300)){ toast('日期和體重都要填喔'); return; }
      if(k > dkey()){ toast('不能記未來的日子啦'); return; }
      S.days[k] = S.days[k] || {water:0,habits:{}}; S.days[k].w = r1(v);
      save(); closeModal(); render(); checkUnlock(); toast('補記好了 ✓'); break; }
    case 'saveprofile': {
      const r = readProfile(); if(r.err){ $('#pWarn').innerHTML = `<div class="warn">${r.err}</div>`; return; }
      S.profile = r.p; save(); render(); toast('已儲存 ✓'); break; }
    case 'savecheer': {
      S.profile.cheer = $('#cheer').value.split('\n').map(s=>s.trim()).filter(Boolean); save(); toast(`存好 ${S.profile.cheer.length} 句打氣話 💌`); break; }
    case 'export': {
      const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `輕輕日記備份_${dkey()}.json`; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000); break; }
    case 'import': { const f = $('#file'); f.onchange = ()=>{
        const file = f.files[0]; if(!file) return; const rd = new FileReader();
        rd.onload = ()=>{ try{ const d = JSON.parse(rd.result); if(!d.profile || !d.days) throw 0;
          if(confirm('用備份檔取代目前的資料？')){ S = d; save(); render(); toast('還原成功 ✓'); } }
          catch(_){ toast('這個檔案看不懂，確定是備份檔嗎？'); } };
        rd.readAsText(file); }; f.click(); break; }
    case 'reset': { if(confirm('確定要清除所有紀錄、重新開始嗎？（無法復原，建議先下載備份）')){ localStorage.removeItem(KEY); S = load(); tab='today'; render(); if(window.Cloud && Cloud.user) Cloud.wipe(); } break; }
    case 'swap': { day.swap = day.swap||{}; day.swap[el.dataset.m] = (day.swap[el.dataset.m]||0) + 1; save(); render(); break; }
    case 'eat': { day.ate = day.ate||{}; day.ate[el.dataset.m] = !day.ate[el.dataset.m]; save(); render(); break; }
    case 'walkdone': { day.walkDone = !day.walkDone; syncWorkout(day); if(!day.habits.walk) day.perfect=false; afterProgress(); break; }
    case 'traindone': { day.trainDone = !day.trainDone; syncWorkout(day); if(!day.habits.walk) day.perfect=false; afterProgress(); break; }
    case 'train': startTrain(); break;
    case 'playv': playVideo(el.dataset.k); break;
    case 'swapall': { day.vswap = day.vswap||{}; todayVideos(day).forEach(k=>{ day.vswap[k]=(day.vswap[k]||0)+1; }); save(); render(); toast('換好了～今天看看新的 🎬'); break; }
    case 'swapv': { day.vswap = day.vswap||{}; day.vswap[el.dataset.k] = (day.vswap[el.dataset.k]||0) + 1; save(); render(); break; }
    case 'vdone': {
      const k = el.dataset.k; day.vdone = day.vdone||{}; day.vdone[k] = true;
      if(k==='walk') day.walkDone = true; else if(k!=='health') day.trainDone = true;
      syncWorkout(day); closeModal(); afterProgress();
      setTimeout(()=>{ if(!$('#mask')){ confetti(['💪','✨','🎉']); toast('跟練完成，好厲害！'); } }, 400);
      break; }
    case 'tpause': T.paused = !T.paused; el.textContent = T.paused ? '▶ 繼續' : '⏸ 暫停'; break;
    case 'tskip': T.left = 0; tick(); break;

    case 'ics': makeICS(); break;
    case 'share': shareToday(); break;
    case 'login': { if(window.Cloud) Cloud.login(); break; }
    case 'watchreload': { if(window.Cloud) Cloud.loadWatch(); break; }
    case 'logout': { if(Cloud.watcher){ Cloud.logout(); break; } if(confirm('登出後，這支手機上的紀錄還會留著，只是不再同步到雲端。確定登出？')) Cloud.logout(); break; }
    case 'later': { S.loginTipUntil = Date.now() + 3*864e5; save(); $('#loginTip').innerHTML=''; toast('好～3 天後再提醒妳，也可以到「設定」登入'); break; }
    case 'syncnow': { Cloud.sync(); break; }
    case 'close': closeModal(); break;
  }
});
document.addEventListener('change', e=>{
  const id = e.target.dataset.rm || e.target.dataset.rmt; if(!id) return;
  S.reminders = S.reminders || {};
  const cur = reminders().find(r=>r.id===id);
  S.reminders[id] = {t: e.target.dataset.rmt ? e.target.value : cur.t, on: e.target.dataset.rm ? e.target.checked : cur.on};
  save();
});

/* ========== 跟練計時 ========== */
let T = null;
function beep(freq=880, ms=160){
  try{ T.ac = T.ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=T.ac.createOscillator(), g=T.ac.createGain(); o.frequency.value=freq; o.connect(g); g.connect(T.ac.destination);
    g.gain.setValueAtTime(.2,T.ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,T.ac.currentTime+ms/1000); o.start(); o.stop(T.ac.currentTime+ms/1000);
  }catch(_){}
  if(navigator.vibrate) navigator.vibrate(120);
}
function startTrain(){
  const p = workoutPlan(), seq = [];
  for(let r=1;r<=p.rounds;r++) p.moves.forEach((id,i)=>{
    seq.push({type:'work', id, r, sec:p.work});
    const last = r===p.rounds && i===p.moves.length-1;
    if(!last) seq.push({type:'rest', id:p.moves[(i+1)%p.moves.length], r, sec:p.rest});
  });
  T = {p, seq, i:-1, left:0, paused:false, ac:T&&T.ac};
  closeModal();
  const m = document.createElement('div'); m.className='mask'; m.id='mask';
  m.innerHTML = `<div class="modal timer" id="tbox"></div>`;
  document.body.appendChild(m);
  next(); T.iv = setInterval(()=>{ if(!T.paused){ T.left--; tick(); } }, 1000);
}
function next(){
  T.i++;
  if(T.i >= T.seq.length) return finishTrain();
  const s = T.seq[T.i]; T.left = s.sec; T.total = s.sec;
  beep(s.type==='work'?880:520, 220);
  drawTimer();
}
function tick(){ if(!T) return; if(T.left <= 0) return next(); if(T.left <= 3) beep(660,90); drawTimer(); }
function drawTimer(){
  const s = T.seq[T.i], mv = MOVES[s.id], box = $('#tbox'); if(!box) return;
  const rest = s.type==='rest';
  box.innerHTML = `
    <div class="muted">第 ${s.r} / ${T.p.rounds} 輪　·　${T.i+1} / ${T.seq.length}</div>
    <div class="em">${rest?'😮‍💨':mv.e}</div>
    <h2>${rest?'休息一下，下一個：'+mv.n:mv.n}</h2>
    <p class="muted">${rest?'喝口水、深呼吸':esc(mv.how)}</p>
    <div class="count ${rest?'rest':''}">${T.left}</div>
    <div class="bar"><i style="width:${(1-T.left/T.total)*100}%"></i></div>
    <div class="muted">${rest?'':pick(['做得好！','慢慢來，動作做對比較重要','圓圓陪妳一起 💪','呼吸不要停喔'])}</div>
    <div class="row2"><button class="btn ghost" data-act="tpause">${T.paused?'▶ 繼續':'⏸ 暫停'}</button><button class="btn ghost" data-act="tskip">跳過 ⏭</button></div>
    <button class="btn ghost" style="background:none" data-act="tstop">先結束</button>`;
}
function stopTrain(){ if(T){ clearInterval(T.iv); } closeModal(); }
function finishTrain(){
  clearInterval(T.iv); closeModal();
  const day = today(); day.trainDone = true; syncWorkout(day);
  beep(1046,300);
  afterProgress();
  setTimeout(()=>{ confetti(['💪','✨','🎉']); if(!$('#mask')) modal('💪','做完了！', `${esc(S.profile.pet)}看妳流汗的樣子好帥！<br>${T.p.walk && !day.walkDone ? '記得再去走走路，今天的運動就全部完成囉。':'今天的運動完成 ✓'}`); }, 600);
}

/* ========== 跟練影片播放 ========== */
function playVideo(kind){
  const v = videoFor(kind, today());
  closeModal();
  const m = document.createElement('div'); m.className='mask'; m.id='mask';
  m.innerHTML = `<div class="modal vmodal">
    <div class="vframe"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&playsinline=1&rel=0" title="${esc(v.t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <h2 style="font-size:16px;margin:12px 0 2px">${esc(v.t)}</h2>
    <div class="muted">${esc(v.ch)}・約 ${v.min} 分鐘　<a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">在 YouTube 開啟</a></div>
    <div class="muted" style="margin-top:6px">跟不上就放慢、隨時休息，膝蓋或腰不舒服就停下來 🙏</div>
    <button class="btn mint" data-act="vdone" data-k="${kind}">做完了 ✓</button>
    <button class="btn ghost" data-act="close">先關掉</button></div>`;
  m.addEventListener('click', e=>{ if(e.target===m) closeModal(); });
  document.body.appendChild(m);
}

/* ========== 行事曆提醒 ========== */
function makeICS(){
  const on = reminders().filter(r=>r.on);
  if(!on.length){ toast('先勾選至少一個提醒'); return; }
  const d = new Date(), ymd = d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const stamp = d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const url = location.href.split('#')[0].split('?')[0];
  const ev = on.map(r=>{ const [h,mi]=r.t.split(':'); return [
    'BEGIN:VEVENT', `UID:qingqing-${r.id}-${ymd}@qingqing-diary`, `DTSTAMP:${stamp}`,
    `DTSTART:${ymd}T${h}${mi}00`, 'DURATION:PT5M', 'RRULE:FREQ=DAILY',
    `SUMMARY:${r.title}`, `DESCRIPTION:${r.body}\\n${url}`, `URL:${url}`,
    'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M',`DESCRIPTION:${r.title}`,'END:VALARM','END:VEVENT'].join('\r\n'); });
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//qingqing-diary//ZH-TW','CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '輕輕日記提醒.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  toast(`已產生 ${on.length} 個每日提醒 📅`);
}

/* ========== 回報給老大 ========== */
async function shareToday(){
  const day = today(), s = stats(), st = streak();
  const p = workoutPlan();
  const text = `${S.profile.name}的輕輕日記 ${dkey().replace(/-/g,'/')}\n`+
    `✅ 今天完成 ${doneCount(day)}/${TOTAL} 項\n`+
    (day.w ? `⚖️ 體重 ${fmt(day.w)} kg（趨勢已輕 ${fmt(s.lost)} kg）\n` : '⚖️ 今天還沒量體重\n')+
    `💧 喝水 ${day.water||0}/${WATER_GOAL} 杯\n`+
    `🏃‍♀️ 運動：${day.habits.walk ? '完成 ✓' : '還沒完成'}（${p.title}）\n`+
    `🔥 連續 ${st.n} 天\n`+
    (day.mood ? `心情 ${day.mood}\n` : '')+
    `老大快來誇我 🥰`;
  try{
    if(navigator.share){ await navigator.share({text}); return; }
    await navigator.clipboard.writeText(text); toast('已複製，貼到 LINE 給老大吧 📋');
  }catch(e){ if(e && e.name==='AbortError') return; toast('分享失敗，再試一次'); }
}

/* ========== 彈窗、提示、彩帶 ========== */
function modal(em, title, html){
  closeModal();
  const m = document.createElement('div'); m.className='mask'; m.id='mask';
  m.innerHTML = `<div class="modal"><div class="em">${em}</div><h2>${title}</h2><p>${html}</p><button class="btn" data-act="close">好～</button></div>`;
  m.addEventListener('click', e=>{ if(e.target===m) closeModal(); });
  document.body.appendChild(m);
}
function pastForm(){
  closeModal();
  const m = document.createElement('div'); m.className='mask'; m.id='mask';
  m.innerHTML = `<div class="modal" style="text-align:left"><h2 style="text-align:center">補記體重</h2>
    <label class="f">日期<input id="pastD" type="date" max="${dkey()}" value="${dkey(addDays(new Date(),-1))}"></label>
    <label class="f">體重（公斤）<input id="pastW" type="number" inputmode="decimal" step="0.1"></label>
    <button class="btn" data-act="savepast">儲存</button><button class="btn ghost" data-act="close">取消</button></div>`;
  m.addEventListener('click', e=>{ if(e.target===m) closeModal(); });
  document.body.appendChild(m);
}
function closeModal(){ const m=$('#mask'); if(m) m.remove(); }
let toastT;
function toast(t){ const old=$('.toast'); if(old) old.remove(); const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(),2200); }
function confetti(set){
  for(let i=0;i<26;i++){ const c=document.createElement('div'); c.className='confetti'; c.textContent=pick(set);
    c.style.left=Math.random()*100+'vw'; c.style.animationDuration=(1.8+Math.random()*1.6)+'s'; c.style.animationDelay=(Math.random()*.4)+'s';
    c.style.fontSize=(18+Math.random()*16)+'px'; document.body.appendChild(c); setTimeout(()=>c.remove(),4200); }
}

// 自動更新：打開或回到 App 時，偷偷問伺服器有沒有新版，有就換上
const APP_VERSION = '20261123-1';
async function checkUpdate(){
  try{
    const r = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if(m && m[1] !== APP_VERSION && sessionStorage.getItem('qq-upd') !== m[1]){
      sessionStorage.setItem('qq-upd', m[1]);   // 避免一直重新整理
      location.replace(location.pathname + '?v=' + m[1]);
    }
  }catch(_){}
}
checkUpdate();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkUpdate(); });

// 跨過午夜時自動換成新的一天
let lastKey = dkey();
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  if(dkey()!==lastKey){ lastKey=dkey(); petLine=null; render(); }
  if(window.Cloud && Cloud.user) Cloud.sync();
});
render();
</script>

<script type="module">
/* ========== 雲端：Google 登入＋同步（Firebase）========== */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

// 這組是 Firebase 網頁設定（本來就是公開的，安全靠資料庫規則把關）
const app = initializeApp({
  apiKey: "AIzaSyC4nP_qg0UzGAbPbAegTXMLA7zd3aPILxs",
  authDomain: "qingqing-diary.firebaseapp.com",
  projectId: "qingqing-diary",
  storageBucket: "qingqing-diary.firebasestorage.app",
  messagingSenderId: "444139585010",
  appId: "1:444139585010:web:974bbdf80968f979a2bf6b",
});
const auth = getAuth(app);
auth.languageCode = 'zh-TW';
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const MSG = {
  'auth/network-request-failed': '網路好像斷了，連上網再試一次',
  'auth/unauthorized-domain': '這個網址還沒被允許登入，請老大到 Firebase 加入網域',
  'permission-denied': '雲端拒絕存取，請重新登入看看',
};
const errText = e => MSG[e && e.code] || ('登入／同步出了點問題：' + ((e && (e.code || e.message)) || '未知錯誤'));

let pushTimer = null;
const Cloud = {
  user: null, busy: false, lastSync: null, error: '', watcher: false,
  async loadWatch(){
    QQ.setWatch({loading:true});
    try{
      const snap = await getDocs(collection(db, 'users'));
      const list = [];
      snap.forEach(d=>{
        if(d.id === Cloud.user.uid) return;
        const v = d.data();
        try{ const data = JSON.parse(v.data || '{}'); if(data.profile) list.push({email: v.email || '', updatedAt: v.updatedAt || 0, data}); }catch(_){}
      });
      list.sort((a,b)=>b.updatedAt - a.updatedAt);
      QQ.setWatch({list});
    }catch(e){ QQ.setWatch({err: errText(e)}); }
  },
  async login(){
    Cloud.error = '';
    try { await signInWithPopup(auth, provider); }
    catch(e){
      if(e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
      if(e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){
        return signInWithRedirect(auth, provider);
      }
      Cloud.error = errText(e); QQ.refresh();
    }
  },
  async wipe(){ try{ await setDoc(Cloud.ref(), { data: '{}', updatedAt: Date.now(), email: Cloud.user.email || '' }); }catch(e){ Cloud.error = errText(e); } },
  async logout(){ await signOut(auth); Cloud.lastSync = null; },
  ref(){ return doc(db, 'users', Cloud.user.uid); },
  async sync(){
    if(!Cloud.user || Cloud.busy) return;
    if(Cloud.watcher) return Cloud.loadWatch();
    Cloud.busy = true; Cloud.error = ''; QQ.refresh();
    try{
      const snap = await getDoc(Cloud.ref());
      if(snap.exists() && snap.data().data){
        const remote = JSON.parse(snap.data().data);
        const merged = QQ.merge(QQ.get(), remote);
        if(merged !== QQ.get()) QQ.replace(merged);
      }
      await Cloud.push(true);
    }catch(e){ Cloud.error = errText(e); }
    Cloud.busy = false; QQ.refresh();
  },
  async push(inside){
    const d = QQ.get();
    if(!Cloud.user || Cloud.watcher || !d.profile) return;
    try{
      await setDoc(Cloud.ref(), { data: JSON.stringify(d), updatedAt: d.updatedAt || Date.now(), email: Cloud.user.email || '' });
      Cloud.lastSync = new Date(); Cloud.error = '';
    }catch(e){ Cloud.error = errText(e); if(inside) throw e; }
    if(!inside) QQ.refresh();
  },
};
window.Cloud = Cloud;

// 每次存檔後 1.5 秒自動上傳（連續點很多下只傳一次）
window.addEventListener('qq-saved', ()=>{
  if(!Cloud.user || Cloud.watcher) return;
  clearTimeout(pushTimer); pushTimer = setTimeout(()=>Cloud.push(), 1500);
});

getRedirectResult(auth).catch(e=>{ Cloud.error = errText(e); QQ.refresh(); });
onAuthStateChanged(auth, user=>{
  const wasWatcher = Cloud.watcher;
  Cloud.user = user;
  Cloud.watcher = !!(user && user.email && QQ.watchers.includes(user.email.toLowerCase()));
  if(wasWatcher !== Cloud.watcher) QQ.render(); else QQ.refresh();
  if(user) Cloud.sync();
});
QQ.refresh();
</script>
